# =====================================================================
# CLAU - Conexiones opticas, RF, de datos y de potencia
# ---------------------------------------------------------------------
# Los tests comprueban que:
#   1. origen y destino existen en components.yaml
#   2. hay espacio para el conector y su holgura de insercion
#   3. el recorrido cabe y respeta el radio minimo de curvatura (fibra)
#   4. los haces en espacio libre tienen su volumen libre de obstaculos
#
# 'holgura_mm' con valor null = TBD: el test lo marca como no comprobable,
# no como correcto.
# =====================================================================

meta:
  revision: 2026-09-21
  nota: >-
    El orden de cada cadena sigue el camino fisico de la senal. Los campos
    'longitud_mm' se rellenan automaticamente desde el ensamblaje una vez
    confirmada la distribucion; aqui solo se declara la topologia.

  # -------------------------------------------------------------------
  # RESTRICCIONES DE ORDEN DE LA CADENA DE FIBRA
  # -------------------------------------------------------------------
  # Son DATOS, no codigo: el chequeo 'orden_cadena_fibra' las lee de aqui y
  # las aplica sobre 'opticas_fibra'. Escribirlas en Python las escondia; aqui
  # cada una lleva su motivo al lado, y anadir una no toca ninguna linea de
  # codigo.
  #
  # 'antes' y 'despues' nombran componentes por su id, salvo cuando nombran un
  # PAPEL: 'funcion:codificador_polarizacion' resuelve a la pieza que declara
  # ese campo en data/components.yaml. Asi, el dia que el codificador sea otra
  # pieza, la restriccion sigue diciendo lo mismo.
  #
  # 'directamente: true' exige que el segundo venga JUSTO detras del primero,
  # sin nada en medio.
  restricciones_orden:
    - antes: aislador
      despues: mod_intensidad_mxer_ln_10
      motivo: >-
        El aislador protege el DFB de retrorreflexiones, y lo que mas
        retrorrefleja de la cadena son los moduladores. Detras de ellos ya no
        protege de nada. Es ademas la primera defensa contra los ataques de
        caballo de Troya.
    - antes: aislador
      despues: "funcion:codificador_polarizacion"
      motivo: >-
        UN AISLADOR PM TRANSMITE UN SOLO EJE DE POLARIZACION. Detras del
        codificador proyectaria los cuatro estados BB84 sobre la misma
        polarizacion y BORRARIA LA CODIFICACION ENTERA. No es degradacion: es
        perdida total de la informacion.
    - antes: filtro_espectral
      despues: mod_intensidad_mxer_ln_10
      motivo: >-
        El filtro quita la ASE del laser. Puesto antes de los moduladores, todo
        lo que se modula ya esta espectralmente limpio, y la ventana por la que
        puede entrar luz de Troya es la mas estrecha posible.
    - antes: mod_intensidad_mxer_ln_10
      despues: acoplador_monitor
      motivo: >-
        El acoplador monitoriza el MXER: cierra su lazo de bias y verifica las
        razones de intensidad decoy/senal. Delante de el no hay nada que
        monitorizar.
    - antes: acoplador_monitor
      despues: voa
      motivo: >-
        Detras del VOA la senal esta ya a fracciones de foton por pulso: no hay
        luz que medir con un fotodiodo. El acoplador tiene que ver la senal
        mientras todavia existe.
    - antes: voa
      despues: "funcion:codificador_polarizacion"
      motivo: >-
        Todo componente de fibra tiene perdida dependiente de la polarizacion, y
        un atenuador variable la tiene por construccion. Detras del codificador
        atenuaria unos estados BB84 mas que otros y DEFORMARIA el conjunto.
        Delante no cuesta nada: la atenuacion es lineal y da igual donde se
        haga.
    - antes: "funcion:codificador_polarizacion"
      despues: colimador
      directamente: true
      motivo: >-
        DESPUES DEL CODIFICADOR SOLO PUEDE IR EL COLIMADOR. Cualquier otro
        componente de fibra proyecta o deforma los cuatro estados, y cualquier
        tramo de fibra PM les mete una fase que deriva con la temperatura,
        porque los estados diagonales viajan a 45 grados de los ejes y NO son
        autoestados de la fibra. El tramo que los une es el mas corto que
        permita la fabricacion, y va recto.

  # -------------------------------------------------------------------
  # TOPOLOGIA DEL BRAZO DE LOS BEACONS
  # -------------------------------------------------------------------
  # UN SOLO SITIO. Hasta el 2026-09-21 esto estaba escrito DOS VECES: como
  # RAMAS_BRAZO en tools/generar_layout.py y, a mano, dentro de
  # chequeo_brazo_beacon en src/clau3d/analysis/fit.py, que daba por hecho que
  # la rama +Y era la de la camara. Al invertir D2 y mover la camara a -X las
  # dos copias dejaron de decir lo mismo, y el chequeo habria seguido midiendo
  # una geometria que ya no existia. Ahora las dos lo leen de aqui.
  #
  # Cada rama sale de una pieza ESTACION por una CARA y crece hacia fuera. Una
  # pieza colocada en una rama puede ser estacion de otra: D2 lo es de dos. El
  # orden importa, porque una rama no se puede colocar hasta que su estacion
  # esta colocada.
  topologia_brazo_beacons:
    - estacion: dicroico_d1
      cara: "+Y"
      piezas: [dicroico_d2, colimador_beacon_bajada]
      motivo: >-
        El brazo compartido de los dos beacons, que es lo que D1 refleja.
        Dentro de el, D2 los separa. Detras de D2 va el colimador del beacon de
        BAJADA, que le inyecta por +Y para que D2 lo transmita hacia D1: es el
        sitio que deja libre la camara al pasar a reflexion. Es la rama que
        aprieta, porque desde el centro de D1 solo hay 47.7 mm hasta la pared.
    - estacion: dicroico_d1
      cara: "-Y"
      piezas: [trampa_luz_d1]
      motivo: >-
        Cuarto puerto de D1, el opuesto al brazo: la fuga en reflexion del 1550.
    - estacion: dicroico_d2
      cara: "-X"
      piezas: [camara_beacon]
      motivo: >-
        El beacon de SUBIDA, que D2 refleja. La camara esta aqui y no en +Y
        desde el 2026-09-21: es la pieza gorda del brazo (30 mm segun su eje) y
        en fila detras de D2 no cabia, mientras que en -X hay unos 71 mm hasta
        la pared del banco. Va CENTRADA en el eje de D2, o sea a 21 mm del
        plano optico, y por eso su seccion no puede pasar de 26 mm: con mas
        baja hasta meterse dentro del FSM.
    - estacion: dicroico_d2
      cara: "+X"
      piezas: [fotodiodo_monitor_beacon]
      motivo: >-
        Cuarto puerto de D2, el que recibe la fuga del beacon de bajada. Sigue
        siendo el fotodiodo despues de invertir D2, y no por casualidad: en un
        divisor a 45 grados los pares de reflexion son FIJOS (-Y con -X, +Y con
        +X), asi que el beacon que entra por +Y tiene su fuga en reflexion en
        +X en las dos configuraciones. Lo que nunca puede pasar es que esa fuga
        apunte a la camara.

# ---------------------------------------------------------------------
# 1. CADENA OPTICA EN FIBRA
# ---------------------------------------------------------------------
# ORDEN CORREGIDO el 2026-09-21 (decision de ACSAR). El de antes ponia el
# aislador, el filtro, el VOA y el acoplador DETRAS del codificador de
# polarizacion, y eso no funciona -- ver 'restricciones_orden' arriba y
# CLAUDE.md 3.10.
#
#   laser -> aislador -> filtro -> MXER (intensidad) -> acoplador 2x2 ->
#   VOA -> MPZ (codificador de polarizacion) -> colimador
#   |______________ fibra PM, eje lento, empalmes por fusion ______|__recto__|
#
# LA REGLA QUE MANDA: todo componente de fibra va ANTES del codificador de
# polarizacion. Antes de el la luz va en polarizacion lineal fija alineada al
# eje lento de la PM, que ES un autoestado: ese tramo puede ser largo y
# curvarse libremente, respetando el radio minimo. Despues de el existen los
# cuatro estados BB84 y NO hay autoestado que valga: el tramo tiene que ser
# corto y recto, y no puede llevar nada dentro.
#
# TODOS los tramos van por EMPALME POR FUSION, cero conectores: la decision
# esta en 'integracion.fibra.empalme' de data/components.yaml, una vez, en vez
# de repetida en los siete tramos. Lo que cada tramo declara es lo suyo.
opticas_fibra:
  - id: f01
    desde: laser_dfb_1550
    hasta: aislador
    tipo: fibra_pm
    union: fusion
    nota: >-
      El aislador va lo mas cerca posible del laser: cualquier retrorreflexion
      que llegue al DFB lo desestabiliza.

  - id: f02
    desde: aislador
    hasta: filtro_espectral
    tipo: fibra_pm
    union: fusion

  - id: f03
    desde: filtro_espectral
    hasta: mod_intensidad_mxer_ln_10
    tipo: fibra_pm
    union: fusion
    nota: >-
      TRAVESIA DE ZONA: el filtro es la ultima pieza de la bandeja y el MXER la
      primera de la franja. Es la UNICA vez que la cadena cruza de una zona a
      la otra, y esta en el tramo pre-codificacion, donde la fibra puede ser
      larga y curvarse. Que sea una sola travesia es una consecuencia del orden
      nuevo: con el de antes la cadena iba y volvia entre bandeja y franja.

  - id: f04
    desde: mod_intensidad_mxer_ln_10
    hasta: acoplador_monitor
    tipo: fibra_pm
    union: fusion
    nota: >-
      Union critica para el layout. Cada modulador reserva 130 mm de recorrido
      recto (cota del plano de Exail, protectores de fibra incluidos) ANTES de
      cualquier bucle.

  - id: f05
    desde: acoplador_monitor
    hasta: voa
    tipo: fibra_pm
    union: fusion

  - id: f06
    desde: voa
    hasta: mod_fase_mpz_ln_10
    tipo: fibra_pm
    union: fusion
    nota: >-
      Ultimo tramo pre-codificacion. A partir de la pieza siguiente ya existen
      los cuatro estados BB84.

  - id: f07
    desde: mod_fase_mpz_ln_10
    hasta: colimador
    tipo: fibra_pm
    union: fusion
    post_codificacion: true
    recto: true
    keep_out: false
    nota: >-
      EL TRAMO QUE NO SE PUEDE CURVAR. Sale del codificador de polarizacion y
      entra en el colimador, y lleva los cuatro estados BB84. Los diagonales
      viajan a 45 grados de los ejes de la fibra PM, no son autoestados, y
      cualquier curva -- y la propia longitud -- les mete una fase que deriva
      con la temperatura: los estados H/V sobrevivirian y los diagonales no, o
      sea una base limpia y la otra rota.
      POR ESO NO GENERA KEEP-OUT DE CURVATURA: no hay codo que reservar, porque
      no hay codo. Lo que hay que reservar es un TRAMO RECTO, y eso lo mide el
      chequeo 'fibra_post_codificacion' contra
      'integracion.fibra.longitud_protector_empalme'.
      Cuanta fibra es tolerable aqui NO SE PUEDE DECIR todavia: falta
      'integracion.fibra.sensibilidad_termica_fase_pm', que es TBD.

  # EL UNICO TRAMO DE FIBRA QUE NO ES DEL CANAL CUANTICO. Lleva
  # 'cadena: beacon_bajada' para que los chequeos de orden no lo metan en la
  # cadena del transmisor: no comparte ni una restriccion con ella.
  - id: f08
    desde: laser_beacon_bajada
    hasta: colimador_beacon_bajada
    tipo: fibra_sm
    cadena: beacon_bajada
    union: fusion
    longitud_onda_nm: 1064
    nota: >-
      TRAVESIA DE ZONA del beacon de bajada: el modulo esta en la BANDEJA, en
      la fila del DFB, y su colimador en el BANCO, detras de D2. Se parte asi
      desde el 2026-09-21 para sacar el disipador del beacon fuera del banco
      optico y para que en el brazo solo quede un cilindro de 12 mm; ver
      CLAUDE.md 3.11.
      FIBRA MONOMODO A 1064 Y NO CRITICA EN POLARIZACION: un beacon es una
      baliza de potencia, no lleva informacion en el estado, asi que da igual
      lo que la birrefringencia le haga a la polarizacion por el camino. Es el
      UNICO tramo de fibra del payload cuyo encaminamiento es libre: no hay que
      alinear ejes, no hay que mantenerlo corto y no hay que mantenerlo recto.
      Lo unico que le aplica es el radio minimo de curvatura, que es el mismo
      TBD de siempre ('integracion.fibra.radio_minimo_curvatura').

# ---------------------------------------------------------------------
# 2. CAMINO OPTICO EN ESPACIO LIBRE
# ---------------------------------------------------------------------
# El canal cuantico entra en el banco BAJANDO SEGUN -Z desde el colimador, y
# un espejo plano a 45 grados lo dobla hacia -X, que es la linea de D1, el FSM
# y el telescopio. Ese espejo existe porque el codificador tiene que alimentar
# al colimador en linea recta; ver CLAUDE.md 3.10.
#
# Arquitectura de DOS DIVISORES en el brazo de los beacons (decision de ACSAR,
# 2026-09-20), que NO cambia: los dos beacons comparten UN SOLO brazo lateral,
# el que refleja D1, y dentro de ese brazo los separa D2:
#
#   canal cuantico  colimador --e01--> espejo --e02--> D1 --e03--> FSM
#                                      --e04--> telescopio --e05--> EXTERIOR
#   beacon subida               D1 --e06--> D2 --e07--> camara      (976 nm)
#   beacon bajada  colimador_bb --e08--> D2 --e09--> D1 -> FSM      (1064 nm)
#   fugas                       D1 --e10--> trampa_luz_d1           (1550 en reflexion)
#                               D2 --e11--> fotodiodo_monitor_beacon (beacon en reflexion)
#
# D2 INVERTIDO EL 2026-09-21 [DECISION ACSAR]: pasa de paso corto a PASO
# LARGO, asi que el 976 de subida ya no lo atraviesa hacia la camara sino que
# se REFLEJA hacia -X, y el 1064 de bajada ya no se refleja sino que lo
# ATRAVIESA desde +Y hacia -Y. Los ids de los tramos NO cambian -- e07 sigue
# siendo "D2 a la camara" y e08 "el beacon de bajada hacia D2" --; lo que
# cambia es por que puerto va cada uno y de donde sale e08, que ahora no es el
# laser entero sino su colimador. Renumerarlos no habria anadido nada y habria
# invalidado todas las referencias del catalogo. Ver CLAUDE.md 3.11.
#
# LOS PARES DE REFLEXION SON FIJOS, y de ahi sale toda la geometria del brazo:
# en un divisor a 45 grados lo que entra por -Y se refleja a -X y lo que entra
# por +Y se refleja a +X. Por eso la fuga del beacon acaba en el fotodiodo
# (+X) en las dos configuraciones, y nunca en la camara.
#
# Los cuatro puertos de cada divisor tienen destino declarado, y hay un test
# que lo comprueba: un puerto sin destino no desaparece porque no se dibuje.
#
# e06 y e09 son EL MISMO TRAMO FISICO recorrido en sentidos contrarios y con
# colores distintos. El keep-out se declara UNA VEZ, en e06, y e09 lo comparte
# con 'keep_out_compartido_con': duplicar el volumen contaria dos veces el
# mismo tubo y ensuciaria el informe de interferencias con una invasion que no
# existe.
opticas_espacio_libre:
  - id: e01
    desde: colimador
    hasta: espejo_plegado_cuantico
    tipo: haz_libre
    longitud_onda_nm: 1550
    diametro_haz_mm:
      valor: null
      estado: TBD
      falta: Diametro del haz colimado
      pedir_a: Equipo de optica de ACSAR
    keep_out: true
    nota: >-
      El colimador apunta segun -Z y el espejo esta debajo, en el banco. Este
      tramo es la consecuencia geometrica de que el codificador tenga que
      alimentar al colimador en linea recta.

  - id: e02
    desde: espejo_plegado_cuantico
    hasta: dicroico_d1
    tipo: haz_libre
    longitud_onda_nm: 1550
    diametro_haz_mm: {valor: null, estado: TBD, falta: Diametro del haz colimado, pedir_a: Equipo de optica de ACSAR}
    keep_out: true
    nota: >-
      El espejo dobla el haz de -Z a -X y lo pone en la linea de D1. A partir
      de aqui el camino es el de siempre y no se ha movido.

  - id: e03
    desde: dicroico_d1
    hasta: fsm
    tipo: haz_libre
    longitud_onda_nm: 1550
    diametro_haz_mm: {valor: null, estado: TBD, falta: Diametro del haz, pedir_a: Equipo de optica de ACSAR}
    keep_out: true
    nota: >-
      El canal cuantico ATRAVIESA D1 (paso largo, borde ~1300 nm); los dos
      beacons se reflejan hacia el brazo lateral.

  - id: e04
    desde: fsm
    hasta: telescopio_cassegrain
    tipo: haz_libre
    longitud_onda_nm: 1550
    diametro_haz_mm: {valor: null, estado: TBD, falta: Diametro del haz, pedir_a: Equipo de optica de ACSAR}
    keep_out: true
    nota: >-
      Tramo COMPARTIDO: por aqui pasa tambien el beacon de bajada de 1064 nm,
      en sentido contrario, porque comparte el FSM con el canal cuantico. De
      ahi que reciba el mismo punto de adelanto; ver
      'integracion.optica.punto_de_adelanto' en data/components.yaml.

  - id: e05
    desde: telescopio_cassegrain
    hasta: EXTERIOR
    tipo: apertura
    keep_out: true
    nota: >-
      La apertura debe tener vision despejada hacia fuera del 6U. Ningun panel,
      antena ni deployable puede invadir este cono. Por ella salen el canal
      cuantico y el beacon de bajada, y entra el de subida.

  - id: e06
    desde: dicroico_d1
    hasta: dicroico_d2
    tipo: haz_libre
    longitud_onda_nm: 976
    diametro_haz_mm: {valor: null, estado: TBD, falta: Diametro del haz de beacon, pedir_a: Equipo de PAT de ACSAR}
    keep_out: true
    bidireccional: true
    bicolor: true
    nota: >-
      Brazo compartido de los dos beacons, en reflexion de D1. BIDIRECCIONAL Y
      BICOLOR: por este mismo tubo suben los 976 nm del beacon de subida hacia
      D2 y bajan los 1064 nm del de bajada hacia D1 (e09). El keep-out se
      declara aqui una sola vez.

  - id: e07
    desde: dicroico_d2
    hasta: camara_beacon
    tipo: haz_libre
    longitud_onda_nm: 976
    diametro_haz_mm: {valor: null, estado: TBD, falta: Diametro del haz de beacon, pedir_a: Equipo de PAT de ACSAR}
    keep_out: true
    nota: >-
      El beacon de subida SE REFLEJA en D2 (paso largo, borde ~1020 nm) y sale
      por -X hasta la camara. ANTES iba en transmision, recto por +Y, y ahi la
      camara no cabia: es el cambio del 2026-09-21. El filtro de banda estrecha
      de 976 nm va DENTRO de la reserva de 'camara_beacon', no como pieza
      suelta: modelarlo aparte anade una pieza mas al brazo.
      Reflexion tiene ademas una ventaja que no se busco: el beacon de subida
      toca una superficie menos de sustrato antes de llegar al sensor que mide
      microvatios.

  - id: e08
    desde: colimador_beacon_bajada
    hasta: dicroico_d2
    tipo: haz_libre
    longitud_onda_nm: 1064
    diametro_haz_mm: {valor: null, estado: TBD, falta: Diametro del haz de beacon, pedir_a: Equipo de PAT de ACSAR}
    keep_out: true
    nota: >-
      Inyeccion EN LINEA con el brazo: el colimador esta detras de D2 en +Y y
      emite hacia -Y, y D2 lo TRANSMITE hacia D1. Antes era una inyeccion
      lateral segun X desde el laser entero; desde el 2026-09-21 el laser es un
      modulo fiberizado que vive en la bandeja (f08) y aqui solo esta su
      colimador. Es el unico tramo del beacon de bajada que no comparte camino
      con nada.

  - id: e09
    desde: dicroico_d2
    hasta: dicroico_d1
    tipo: haz_libre
    longitud_onda_nm: 1064
    diametro_haz_mm: {valor: null, estado: TBD, falta: Diametro del haz de beacon, pedir_a: Equipo de PAT de ACSAR}
    keep_out: false
    keep_out_compartido_con: e06
    nota: >-
      D2 TRANSMITE el beacon de bajada hacia -Y, de vuelta a D1, que lo refleja
      hacia el FSM y el telescopio. Lo transmite y no lo refleja desde que D2
      es paso largo (2026-09-21), y EL PRECIO ES ESTE TRAMO: el beacon
      atraviesa el sustrato, o sea una cara mas con recubrimiento y un fantasma
      mas de la cara trasera. Los dos se los come el beacon, que es una baliza
      de 100 mW; el canal cuantico no pasa por D2 y no se entera.
      RECORRE EL MISMO TRAMO FISICO QUE
      e06 EN SENTIDO CONTRARIO, asi que no lleva keep-out propio: comparte el
      de e06. Un segundo volumen sobre el mismo tubo no reserva nada nuevo y si
      genera una invasion de keep-out que no significa nada.

  - id: e10
    desde: dicroico_d1
    hasta: trampa_luz_d1
    tipo: haz_libre
    longitud_onda_nm: 1550
    diametro_haz_mm: {valor: null, estado: TBD, falta: Diametro del haz colimado, pedir_a: Equipo de optica de ACSAR}
    keep_out: true
    nota: >-
      Cuarto puerto de D1, el opuesto al brazo: la fuga en REFLEXION del 1550.
      Ningun divisor transmite el 100 %, y lo que no transmite sale por aqui.
      La trampa es OBLIGATORIA: sin ella esa luz se queda rebotando en el banco
      hasta llegar a la camara de seguimiento o de vuelta al canal cuantico.

  - id: e11
    desde: dicroico_d2
    hasta: fotodiodo_monitor_beacon
    tipo: haz_libre
    longitud_onda_nm: 1064
    diametro_haz_mm: {valor: null, estado: TBD, falta: Diametro del haz de beacon, pedir_a: Equipo de PAT de ACSAR}
    keep_out: true
    nota: >-
      Cuarto puerto de D2, el opuesto al colimador del beacon: la fuga en
      REFLEXION del beacon de bajada, que entra por +Y y por tanto tiene su par
      de reflexion en +X. SIGUE SIENDO EL FOTODIODO despues de invertir D2, y
      eso no es suerte: los pares de reflexion de un divisor a 45 grados son
      fijos, asi que la fuga directa del beacon sale por el cuarto puerto en
      las dos configuraciones y en ninguna apunta a la camara. Lo que cambia es
      solo si la fuga es en transmision o en reflexion.
      Instrumentarla con un fotodiodo da telemetria de salud del beacon sin
      tocar el haz util. Si no se instrumenta, ese puerto
      necesita igualmente una trampa: 'trampa_luz_d2', declarada en el catalogo
      como alternativa EXCLUYENTE del fotodiodo.

# ---------------------------------------------------------------------
# 3. RF COAXIAL
# ---------------------------------------------------------------------
rf_coaxial:
  - id: r01
    desde: pcb2_drivers_opticos
    hasta: laser_dfb_1550
    tipo: coaxial
    nota: Pulsos del laser. Recorrido corto e igualado en retardo con los moduladores.
    holgura_mm: {valor: null, estado: TBD, falta: Radio de curvatura y holgura del coaxial elegido, pedir_a: Equipo de electronica de ACSAR}

  - id: r02
    desde: pcb2_drivers_opticos
    hasta: mod_intensidad_mxer_ln_10
    tipo: coaxial
    conector_destino:
      valor: [6.1, 10.0]
      unidad: mm
      estado: confirmado
      fuente: Plano Exail 03_2026_ED2 / 00025851-B p.9
      nota: Conector RF lateral del modulador. Necesita holgura lateral para el cable.
    holgura_mm: {valor: null, estado: TBD, falta: Radio de curvatura y holgura del coaxial elegido, pedir_a: Equipo de electronica de ACSAR}

  - id: r03
    desde: pcb2_drivers_opticos
    hasta: mod_fase_mpz_ln_10
    tipo: coaxial
    conector_destino:
      valor: [6.1, 10.0]
      unidad: mm
      estado: referencia
      fuente: Plano Exail 03_2026_ED3 / 00025631-B p.9 (NIR-MPX-LN grado espacial)
    holgura_mm: {valor: null, estado: TBD, falta: Radio de curvatura y holgura del coaxial elegido, pedir_a: Equipo de electronica de ACSAR}

# ---------------------------------------------------------------------
# 4. DATOS Y CONTROL
# ---------------------------------------------------------------------
datos:
  - id: d01
    desde: obc_kryten_m3_plus
    hasta: pcb1_control_qkd
    tipo: bus_datos
    bidireccional: true

  - id: d02
    desde: obc_kryten_m3_plus
    hasta: radio_banda_s_quasar_strx
    tipo: bus_datos
    bidireccional: true
    nota: Canal clasico de post-procesado de la clave (arquitectura opcion B).

  - id: d03
    desde: obc_kryten_m3_plus
    hasta: pcb1_control_qkd
    tipo: pps
    bidireccional: false
    nota: PPS del GNSS integrado en el Kryten-M3-PLUS. Disciplina el reloj de PCB-1.

  - id: d04
    desde: pcb1_control_qkd
    hasta: pcb2_drivers_opticos
    tipo: bus_datos
    bidireccional: false

  - id: d05
    desde: pcb1_control_qkd
    hasta: pcb3_pat
    tipo: bus_datos
    bidireccional: true

  - id: d06
    desde: adcs_iadcs400
    hasta: pcb3_pat
    tipo: bus_datos
    bidireccional: true
    nota: Actitud para el traspaso de apuntado grueso a fino.

  # Los dos fotodiodos del acoplador 2x2. Se declaran para que ninguno de los
  # dos puertos de derivacion se quede sin destino -- el mismo criterio que los
  # cuartos puertos de los divisores --, y SOLO eso: el cableado detallado es
  # de la fase de electronica y aqui no se inventa.
  - id: m01
    desde: acoplador_monitor
    hasta: pcb2_drivers_opticos
    tipo: senal_fotodiodo
    bidireccional: false
    nota: >-
      Fotodiodo de MONITORIZACION (derivacion hacia delante). Cierra el lazo de
      bias del MXER -- el punto de trabajo de su curva en cos^2, que deriva con
      la temperatura y con la carga del sustrato -- y verifica las razones de
      intensidad decoy/senal.
    encaminamiento:
      valor: null
      estado: TBD
      falta: >-
        Por donde va el cable del fotodiodo, y si el detector va en la bandeja
        con su transimpedancia o montado directamente en PCB-2. Lo segundo
        cambia la envolvente de 'acoplador_monitor'.
      pedir_a: Equipo de electronica de ACSAR

  - id: m02
    desde: acoplador_monitor
    hasta: pcb2_drivers_opticos
    tipo: senal_fotodiodo
    bidireccional: false
    nota: >-
      Fotodiodo VIGIA DE TROYA (derivacion hacia atras). Ve la luz que entra
      DESDE EL CANAL y que ha recorrido el codificador y el VOA en sentido
      inverso. Es el unico punto de la cadena donde se puede detectar un ataque
      de caballo de Troya sin tocar el haz util.
    encaminamiento:
      valor: null
      estado: TBD
      falta: >-
        Por donde va el cable, y sobre todo QUE UMBRAL Y QUE CADENCIA de
        lectura hacen falta para que esto sirva de contramedida y no solo de
        telemetria. Eso es analisis de seguridad, no electronica.
      pedir_a: Equipo de electronica / de payload de ACSAR

