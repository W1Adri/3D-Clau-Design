# =====================================================================
# CLAU - Conexiones opticas, RF, de datos y de potencia
# ---------------------------------------------------------------------
# Los tests comprueban que:
#   1. origen y destino existen en components.yaml
#   2. hay espacio para el conector y su holgura de insercion
#   3. el recorrido cabe y respeta el radio minimo de curvatura (fibra)
#   4. los haces en espacio libre tienen su volumen libre de obstaculos
#
# 'holgura_mm' con valor null = TBD: el test lo marca como no comprobable,
# no como correcto.
# =====================================================================

meta:
  revision: 2026-09-19
  nota: >-
    El orden de cada cadena sigue el camino fisico de la senal. Los campos
    'longitud_mm' se rellenan automaticamente desde el ensamblaje una vez
    confirmada la distribucion; aqui solo se declara la topologia.

# ---------------------------------------------------------------------
# 1. CADENA OPTICA EN FIBRA
# ---------------------------------------------------------------------
# laser -> mod. intensidad -> codificador de polarizacion (mod. fase) ->
# VOA -> aislador -> filtro -> acoplador/fotodiodo -> colimador
opticas_fibra:
  - id: f01
    desde: laser_dfb_1550
    hasta: mod_intensidad_mxer_ln_10
    tipo: fibra_pm
    conector:
      valor: null
      estado: TBD
      falta: Tipo de conector optico (AVIM / Mini-AVIM de grado espacial, o empalme por fusion)
      pedir_a: Equipo de payload de ACSAR
    holgura_mm:
      valor: null
      estado: TBD
      falta: Holgura de insercion del conector elegido
      pedir_a: Equipo de payload de ACSAR

  - id: f02
    desde: mod_intensidad_mxer_ln_10
    hasta: mod_fase_mpz_ln_10
    tipo: fibra_pm
    conector: {valor: null, estado: TBD, falta: Tipo de conector optico, pedir_a: Equipo de payload de ACSAR}
    holgura_mm: {valor: null, estado: TBD, falta: Holgura de insercion, pedir_a: Equipo de payload de ACSAR}
    nota: >-
      Union critica para el layout. Cada modulador reserva 130 mm de recorrido
      recto (cota del plano de Exail, protectores de fibra incluidos) ANTES de
      cualquier bucle.

  - id: f03
    desde: mod_fase_mpz_ln_10
    hasta: voa
    tipo: fibra_pm
    conector: {valor: null, estado: TBD, falta: Tipo de conector optico, pedir_a: Equipo de payload de ACSAR}
    holgura_mm: {valor: null, estado: TBD, falta: Holgura de insercion, pedir_a: Equipo de payload de ACSAR}

  - id: f04
    desde: voa
    hasta: aislador
    tipo: fibra_pm
    conector: {valor: null, estado: TBD, falta: Tipo de conector optico, pedir_a: Equipo de payload de ACSAR}
    holgura_mm: {valor: null, estado: TBD, falta: Holgura de insercion, pedir_a: Equipo de payload de ACSAR}

  - id: f05
    desde: aislador
    hasta: filtro_espectral
    tipo: fibra_pm
    conector: {valor: null, estado: TBD, falta: Tipo de conector optico, pedir_a: Equipo de payload de ACSAR}
    holgura_mm: {valor: null, estado: TBD, falta: Holgura de insercion, pedir_a: Equipo de payload de ACSAR}

  - id: f06
    desde: filtro_espectral
    hasta: acoplador_monitor
    tipo: fibra_pm
    conector: {valor: null, estado: TBD, falta: Tipo de conector optico, pedir_a: Equipo de payload de ACSAR}
    holgura_mm: {valor: null, estado: TBD, falta: Holgura de insercion, pedir_a: Equipo de payload de ACSAR}

  - id: f07
    desde: acoplador_monitor
    hasta: colimador
    tipo: fibra_pm
    conector: {valor: null, estado: TBD, falta: Tipo de conector optico, pedir_a: Equipo de payload de ACSAR}
    holgura_mm: {valor: null, estado: TBD, falta: Holgura de insercion, pedir_a: Equipo de payload de ACSAR}
    nota: Salida de la bandeja optica hacia el banco de espacio libre.

# ---------------------------------------------------------------------
# 2. CAMINO OPTICO EN ESPACIO LIBRE
# ---------------------------------------------------------------------
# colimador -> dicroico -> FSM -> telescopio   (canal cuantico, bajada)
# dicroico  -> camara                          (beacon de subida, reflexion)
opticas_espacio_libre:
  - id: e01
    desde: colimador
    hasta: dicroico
    tipo: haz_libre
    diametro_haz_mm:
      valor: null
      estado: TBD
      falta: Diametro del haz colimado
      pedir_a: Equipo de optica de ACSAR
    keep_out: true

  - id: e02
    desde: dicroico
    hasta: fsm
    tipo: haz_libre
    diametro_haz_mm: {valor: null, estado: TBD, falta: Diametro del haz, pedir_a: Equipo de optica de ACSAR}
    keep_out: true
    nota: El canal cuantico ATRAVIESA el dicroico; el beacon de subida se refleja.

  - id: e03
    desde: fsm
    hasta: telescopio_cassegrain
    tipo: haz_libre
    diametro_haz_mm: {valor: null, estado: TBD, falta: Diametro del haz, pedir_a: Equipo de optica de ACSAR}
    keep_out: true

  - id: e04
    desde: dicroico
    hasta: camara_beacon
    tipo: haz_libre
    diametro_haz_mm: {valor: null, estado: TBD, falta: Diametro del haz de beacon, pedir_a: Equipo de PAT de ACSAR}
    keep_out: true
    nota: Brazo de reflexion del dicroico. Mide el error de apuntado.

  - id: e05
    desde: telescopio_cassegrain
    hasta: EXTERIOR
    tipo: apertura
    keep_out: true
    nota: >-
      La apertura debe tener vision despejada hacia fuera del 6U. Ningun panel,
      antena ni deployable puede invadir este cono.

# ---------------------------------------------------------------------
# 3. RF COAXIAL
# ---------------------------------------------------------------------
rf_coaxial:
  - id: r01
    desde: pcb2_drivers_opticos
    hasta: laser_dfb_1550
    tipo: coaxial
    nota: Pulsos del laser. Recorrido corto e igualado en retardo con los moduladores.
    holgura_mm: {valor: null, estado: TBD, falta: Radio de curvatura y holgura del coaxial elegido, pedir_a: Equipo de electronica de ACSAR}

  - id: r02
    desde: pcb2_drivers_opticos
    hasta: mod_intensidad_mxer_ln_10
    tipo: coaxial
    conector_destino:
      valor: [6.1, 10.0]
      unidad: mm
      estado: confirmado
      fuente: Plano Exail 03_2026_ED2 / 00025851-B p.9
      nota: Conector RF lateral del modulador. Necesita holgura lateral para el cable.
    holgura_mm: {valor: null, estado: TBD, falta: Radio de curvatura y holgura del coaxial elegido, pedir_a: Equipo de electronica de ACSAR}

  - id: r03
    desde: pcb2_drivers_opticos
    hasta: mod_fase_mpz_ln_10
    tipo: coaxial
    conector_destino:
      valor: [6.1, 10.0]
      unidad: mm
      estado: referencia
      fuente: Plano Exail 03_2026_ED3 / 00025631-B p.9 (NIR-MPX-LN grado espacial)
    holgura_mm: {valor: null, estado: TBD, falta: Radio de curvatura y holgura del coaxial elegido, pedir_a: Equipo de electronica de ACSAR}

# ---------------------------------------------------------------------
# 4. DATOS Y CONTROL
# ---------------------------------------------------------------------
datos:
  - id: d01
    desde: obc_kryten_m3_plus
    hasta: pcb1_control_qkd
    tipo: bus_datos
    bidireccional: true

  - id: d02
    desde: obc_kryten_m3_plus
    hasta: radio_banda_s_quasar_strx
    tipo: bus_datos
    bidireccional: true
    nota: Canal clasico de post-procesado de la clave (arquitectura opcion B).

  - id: d03
    desde: obc_kryten_m3_plus
    hasta: pcb1_control_qkd
    tipo: pps
    bidireccional: false
    nota: PPS del GNSS integrado en el Kryten-M3-PLUS. Disciplina el reloj de PCB-1.

  - id: d04
    desde: pcb1_control_qkd
    hasta: pcb2_drivers_opticos
    tipo: bus_datos
    bidireccional: false

  - id: d05
    desde: pcb1_control_qkd
    hasta: pcb3_pat
    tipo: bus_datos
    bidireccional: true

  - id: d06
    desde: adcs_iadcs400
    hasta: pcb3_pat
    tipo: bus_datos
    bidireccional: true
    nota: Actitud para el traspaso de apuntado grueso a fino.

# ---------------------------------------------------------------------
# 5. POTENCIA
# ---------------------------------------------------------------------
potencia:
  - {id: p01, desde: bateria_optimus_30,     hasta: eps_starbuck_nano_plus, tipo: potencia, nota: Baterias al EPS}
  - {id: p02, desde: paneles_photon_side,    hasta: eps_starbuck_nano_plus, tipo: potencia}
  - {id: p03, desde: eps_starbuck_nano_plus, hasta: obc_kryten_m3_plus,     tipo: potencia}
  - {id: p04, desde: eps_starbuck_nano_plus, hasta: adcs_iadcs400,          tipo: potencia}
  - {id: p05, desde: eps_starbuck_nano_plus, hasta: radio_banda_s_quasar_strx, tipo: potencia}
  - {id: p06, desde: eps_starbuck_nano_plus, hasta: pcb1_control_qkd,       tipo: potencia}
  - {id: p07, desde: eps_starbuck_nano_plus, hasta: pcb2_drivers_opticos,   tipo: potencia}
  - {id: p08, desde: eps_starbuck_nano_plus, hasta: pcb3_pat,               tipo: potencia}
  - id: p09
    desde: eps_starbuck_nano_plus
    hasta: laser_dfb_1550
    tipo: potencia
    nota: >-
      El laser con su Peltier consume 4.1 W, el mayor consumo del payload.
      Si esa potencia sale del bus del EPS directamente o pasa por PCB-2 es
      una decision abierta: PCB-2 controla el pulsado y el lazo del Peltier,
      pero encaminar 4.1 W por la tarjeta de drivers tiene coste termico.
    encaminamiento:
      valor: null
      estado: TBD
      falta: Si la potencia del laser pasa por PCB-2 o va directa del bus del EPS
      pedir_a: Equipo de electronica de ACSAR

# ---------------------------------------------------------------------
# 6. CONTROL TERMICO
# ---------------------------------------------------------------------
termico:
  - id: t01
    zona: bandeja_optica
    componentes: [mod_intensidad_mxer_ln_10, mod_fase_mpz_ln_10, laser_dfb_1550]
    rango_requerido:
      valor: [0.0, 70.0]
      unidad: C
      estado: confirmado
      fuente: Ficha Exail grado espacial MXER-LN-10 (extincion garantizada)
    controlado_por: pcb2_drivers_opticos
    nota: >-
      La bandeja necesita lazo termico propio. Reservar espacio para sensores y
      calefactores. Ubicacion exacta pendiente de fijar la distribucion.
    estado_ubicacion: TBD

  - id: t02
    zona: baterias
    componentes: [bateria_optimus_30]
    rango_requerido:
      valor: [-10.0, 50.0]
      unidad: C
      estado: confirmado
      fuente: https://www.aac-clyde.space/wp-content/uploads/2021/11/AAC_DataSheet_Optimus.pdf
    controlado_por: eps_starbuck_nano_plus
    estado_ubicacion: TBD
