    nota: >-
      El laser con su Peltier consume 4.1 W, el mayor consumo del payload.
      Si esa potencia sale del bus del EPS directamente o pasa por PCB-2 es
      una decision abierta: PCB-2 controla el pulsado y el lazo del Peltier,
      pero encaminar 4.1 W por la tarjeta de drivers tiene coste termico.
    encaminamiento:
      valor: null
      estado: TBD
      falta: Si la potencia del laser pasa por PCB-2 o va directa del bus del EPS
      pedir_a: Equipo de electronica de ACSAR

# ---------------------------------------------------------------------
# 6. CONTROL TERMICO
# ---------------------------------------------------------------------
termico:
  # PARTIDA EN DOS el 2026-09-21. Hasta entonces t01 declaraba una sola zona
  # "bandeja_optica" con el laser y los dos moduladores dentro, y eso llevaba
  # desfasado desde el 2026-09-20: los moduladores estan en la FRANJA, no en la
  # bandeja, y las dos zonas no tienen ni el mismo problema termico ni la misma
  # vecindad. La bandeja es donde esta TODO EL CALOR (4.1 W del DFB mas el
  # beacon) y esta lejos del barrilete; la franja no disipa casi nada y esta
  # PEGADA al barrilete, que es lo que quiere estabilidad. Declararlas juntas
  # escondia justamente el riesgo abierto de CLAUDE.md 3.6.
  - id: t01
    zona: bandeja_optica
    componentes: [laser_dfb_1550, laser_beacon_bajada]
    rango_requerido:
      valor: [0.0, 70.0]
      unidad: C
      estado: confirmado
      fuente: Ficha Exail grado espacial MXER-LN-10 (extincion garantizada)
    controlado_por: pcb2_drivers_opticos
    nota: >-
      LA ZONA DE LAS FUENTES, y por tanto la que disipa: el DFB con sus 4.1 W
      es el mayor consumo del payload y el modulo del beacon de bajada anade lo
      suyo. Los dos se atornillan a la placa, que les hace de disipador, y los
      dos estan en el extremo -Z, lo mas lejos posible del barrilete del
      telescopio. Aqui el problema es EVACUAR, no estabilizar.
      El rango es todavia el de la extincion del MXER, que ya no esta en esta
      zona: hace falta el rango propio del DFB y el del modulo de beacon.
      Reservar espacio para sensores y calefactores.
    estado_ubicacion: TBD

  - id: t03
    zona: franja_lateral
    componentes: [mod_intensidad_mxer_ln_10, acoplador_monitor, voa, mod_fase_mpz_ln_10]
    rango_requerido:
      valor: [0.0, 70.0]
      unidad: C
      estado: confirmado
      fuente: Ficha Exail grado espacial MXER-LN-10 (extincion garantizada)
    controlado_por: pcb2_drivers_opticos
    nota: >-
      LA ZONA DE LA CADENA, y aqui el problema es el contrario: casi no disipa
      -- los moduladores de niobato apenas consumen y los drivers estan en
      PCB-2, en la otra columna -- pero esta PEGADA AL BARRILETE del
      telescopio, que quiere estabilidad termica. Es el riesgo abierto de
      CLAUDE.md 3.6, ahora declarado donde se puede ver.
      EL MPZ ES LA PIEZA MAS SENSIBLE DE LAS CUATRO, y no por su extincion: es
      el codificador de polarizacion, y en niobato el punto de trabajo en fase
      deriva con la temperatura igual que el bias del MXER deriva en voltaje.
      Una deriva de fase en el codificador es una rotacion de los cuatro
      estados BB84, o sea QBER. El rango de 0 a 70 C que hereda del MXER es la
      extincion, no la estabilidad de fase, y eso ultimo es lo que falta.
    estado_ubicacion: TBD

  - id: t02
    zona: baterias
    componentes: [bateria_optimus_30]
    rango_requerido:
      valor: [-10.0, 50.0]
      unidad: C
      estado: confirmado
      fuente: https://www.aac-clyde.space/wp-content/uploads/2021/11/AAC_DataSheet_Optimus.pdf
    controlado_por: eps_starbuck_nano_plus
    estado_ubicacion: TBD
