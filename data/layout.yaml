# =====================================================================
# CLAU - Distribucion dentro del 6U
# ---------------------------------------------------------------------
# ESTADO: CONFIRMADA (opcion "dos columnas de 3U", elegida el 2026-09-20).
#
# GENERADO por tools/generar_layout.py. No editar a mano: ninguna
# coordenada se escribe, todas salen de data/components.yaml.
#   uv run python tools/generar_layout.py
#
# Coordenadas CDS Rev 14.1: origen en el centro geometrico del 6U.
#   X: +-113.15 mm (ancho, 226.3)
#   Y: +-50.00  mm (alto,  100.0)
#   Z: +-183.00 mm (largo, 366.0). La cara -Z entra primero.
# Zona util interior: 221.7 x 95.4 x 361.4 mm.
#
# Reparto: dos columnas a lo largo de TODO Z.
#   X < -10.85 mm -> plataforma (100.0 mm de ancho)
#   X > -10.85 mm -> payload (121.7 mm de ancho)
# En la zona del telescopio el payload se parte otra vez en X:
#   X > +84.55 mm -> franja de moduladores (26.3 mm)
# =====================================================================

meta:
  estado: confirmada
  fecha: 2026-09-21
  nota: >-
    Dos columnas de 3U a lo largo de todo Z. La pila PC104 queda holgada:
    305 mm usados de 361 mm. La columna de payload mide
    121.7 mm de ancho y se parte en dos a lo largo del telescopio:
    95.4 mm para el barrilete y 26.3 mm de franja lateral.
    REPARTO REVISADO EL 2026-09-21 (CLAUDE.md 3.10): la bandeja se queda
    con la FUENTE -- laser, aislador y filtro -- y la franja lleva todo lo
    que modula, monitoriza, atenua y codifica, apilado en BANDAS DE Y,
    porque todo componente de fibra tiene que ir antes del codificador de
    polarizacion y despues de el la fibra no se puede curvar. Asi la
    cadena cruza de zona una sola vez, y esa vez es pre-codificacion.
    El telescopio reserva 200 mm. PCB-2 sigue
    en la otra columna, con lo que el coaxial RF cruza el satelite a lo
    ancho.

zonas:
  - id: z_plataforma
    nombre: "Columna de plataforma - pila PC104 a lo largo de todo Z"
    caja:
      min: [-110.85, -47.70, -180.70]
      max: [-10.85, 47.70, 180.70]
    nota: >-
      ADCS en +Z, para que el star tracker ST200 mire por la misma cara
      que el telescopio. Despues OBC, EPS, radio banda S, PCB-3, PCB-1 y
      PCB-2, y las baterias al final de -Z, que equilibran en Z la masa
      del telescopio, y la antena de banda S detras de ellas, contra la
      pared -Z, que es la unica cara con hueco. La pila usa 305 mm de los
      361 mm disponibles. Cada ranura se mide sobre la geometria DIBUJADA,
      no sobre la altura de ficha: las fichas AAC no incluyen el conector
      PC104 pasante y los STEP si. Las tres PCBs propias se dibujan con
      una altura SUPUESTA de 15 mm.

  - id: z_payload_telescopio
    nombre: "Telescopio"
    caja:
      min: [-10.85, -47.70, -19.30]
      max: [84.55, 47.70, 180.70]
    nota: >-
      Telescopio Cassegrain apuntando por +Z. 200 mm RESERVADOS en Z (dato
      'longitud_reservada', estado decision, provisional hasta el STEP).
      OJO: los "~2U" del brief son ~227 mm con la U de longitud de la CDS
      (113.5 mm), no 200. Esta zona mide 95.4 mm en X, que es el mayor
      diametro de barrilete que cabe en la altura interior. El barrilete
      se dibuja LLENANDO la zona, porque su envolvente es una cota
      superior y no una medida: asi se ve que con 90 mm de apertura libre
      no queda sitio para barrilete, celda ni ajuste. En cuanto llegue el
      STEP, sustituye al cilindro sin tocar nada.

  - id: z_payload_franja
    nombre: "Franja lateral - modulacion, monitorizacion, atenuacion y codificacion"
    caja:
      min: [84.55, -47.70, -19.30]
      max: [110.85, 47.70, 180.70]
    nota: >-
      Los 26.3 mm de X que quedan al lado del telescopio, a lo largo de
      toda su longitud. El ancho no se ha elegido: el barrilete no puede
      pasar de los 95.4 mm de altura interior, asi que esta franja existe
      para cualquier diametro que permita montar el telescopio. Desde el
      2026-09-21 aqui va TODO lo que hay entre la fuente y el colimador --
      MXER, acoplador 2x2, VOA y el codificador de polarizacion -- mas el
      propio colimador, porque todo componente de fibra tiene que ir ANTES
      del codificador y el codificador tiene que alimentar al colimador en
      linea recta. EL REPARTO ES EN BANDAS DE Y, y no se ha elegido: la
      franja tiene 26.3 mm de X contra 95.4 mm de Y, y la X del
      codificador esta PINCHADA por la coaxialidad con el colimador. Los
      bucles de fibra van en el plano Y-Z por el mismo motivo: con el
      radio modelado hacen falta 60 mm de diametro y en X no caben. EL
      TRAMO RECTO NO CABE: mod_fase_mpz_ln_10 se sale por 18.0 mm y NO
      esta colocado. Ver el chequeo 'fibra_post_codificacion' y CLAUDE.md
      3.10.

  - id: z_payload_banco
    nombre: "Banco optico de espacio libre"
    caja:
      min: [-10.85, -47.70, -74.30]
      max: [110.85, 47.70, -19.30]
    nota: >-
      Canal cuantico: el colimador baja el haz segun -Z desde la franja,
      el espejo de plegado lo dobla hacia -X y de ahi D1 -> FSM ->
      telescopio. De D1 sale hacia +Y UN SOLO brazo para los dos beacons,
      y dentro de el D2 los separa: la camara en transmision (976 nm) y el
      laser de bajada inyectando lateralmente en reflexion (1064 nm). Los
      dos cuartos puertos llevan su trampa y su fotodiodo. El FSM esta
      sobre el eje optico del telescopio (X = +36.85) porque es el que
      dobla el haz de X a Z, y eso deja D1 y el espejo de plegado en linea
      hacia +X. Margen contra la pared +X: 7.5 mm. EL BRAZO NO CABE:
      camara_beacon se sale por la rama +Y en 16.8 mm y NO esta colocado.
      Apretarlo hasta que entrara, o dibujarlo saliendose del satelite,
      seria esconder el resultado. Ver el chequeo 'brazo_beacon' y
      CLAUDE.md 3.9.

  - id: z_payload_bandeja
    nombre: "Bandeja optica de fibra"
    caja:
      min: [-10.85, -47.70, -180.70]
      max: [110.85, 47.70, -74.30]
    nota: >-
      106.4 mm de Z con los 121.7 mm de ancho enteros. Desde el 2026-09-21
      aqui esta SOLO LA FUENTE: el laser DFB, el aislador y el filtro.
      Todo lo que modula, monitoriza, atenua y codifica esta en la franja,
      asi que la cadena cruza de zona UNA SOLA VEZ, y esa vez cae en el
      tramo pre-codificacion, que es el que se puede curvar. Las filas
      avanzan segun Z en el orden y el sentido de la cadena: el laser al
      extremo -Z, lo mas lejos posible del barrilete porque con sus 4.1 W
      es la principal fuente de calor del payload, y la salida hacia la
      franja en +Z. Quedan 43.6 mm de Z libres al final para los bucles,
      mas los huecos entre filas. Cuanta fibra cabe ahi NO se puede decir:
      falta el radio minimo de curvatura. Zona con control termico propio.

# Volumenes reservados. TODOS salen de numeros SUPUESTOS: el radio
# minimo de curvatura de la fibra, el del coaxial y el diametro de haz
# siguen siendo TBD. Por eso cada uno lleva su estado y su fuente, y
# por eso invadir uno NO tumba el codigo de salida de `clau3d informe`:
# no es un choque de geometrias, es la consecuencia de una hipotesis.
