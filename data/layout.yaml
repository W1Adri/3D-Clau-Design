# =====================================================================
# CLAU - Distribucion dentro del 6U
# ---------------------------------------------------------------------
# ESTADO: PROPUESTA. Las zonas de abajo son una propuesta razonada y todavia
# NO estan confirmadas por el equipo. La lista 'colocaciones' esta VACIA a
# proposito: no se coloca ninguna pieza hasta que la distribucion se apruebe.
#
# Coordenadas CDS Rev 14.1: origen en el centro geometrico del 6U.
#   X: +-113.15 mm (ancho, 226.3)
#   Y: +-50.00  mm (alto,  100.0)
#   Z: +-183.00 mm (largo, 366.0). La cara -Z entra primero en el dispensador.
# Zona util interior con el espesor de pared declarado: 216.5 x 90.2 x 356.2 mm.
# =====================================================================

meta:
  estado: propuesta          # propuesta | confirmada
  fecha: 2026-09-19
  nota: >-
    Reparto en tres bandas a lo largo de Z, con la banda de +Z dividida en dos
    columnas en X. Razonamiento completo en CLAUDE.md, seccion "Distribucion
    propuesta". Al confirmarla: poner estado 'confirmada' y rellenar
    'colocaciones'.

# ---------------------------------------------------------------------
# ZONAS (reserva de volumen, no piezas)
# ---------------------------------------------------------------------
zonas:
  - id: z_telescopio
    nombre: Telescopio y apertura de salida
    caja:
      min: [8.25, -45.1, -20.0]
      max: [108.25, 45.1, 178.1]
    nota: >-
      Telescopio Cassegrain apuntando por la cara +Z. Ocupa toda la altura util.
      Su diametro exterior es TBD: si supera ~90 mm deja de caber (ver el
      chequeo 'apertura_telescopio').

  - id: z_pila_pc104
    nombre: Pila PC104 de plataforma
    caja:
      min: [-108.25, -45.1, -20.0]
      max: [-8.25, 45.1, 178.1]
    nota: >-
      Tarjetas apiladas a lo largo de Z: ADCS (el mas alto, junto a +Z para que
      el star tracker ST200 mire por la misma cara que el telescopio), EPS, OBC,
      radio banda S, baterias y PCB-1. 198 mm de longitud de pila disponibles.

  - id: z_mazo_cables
    nombre: Canal central de cableado
    caja:
      min: [-8.25, -45.1, -20.0]
      max: [8.25, 45.1, 178.1]
    nota: >-
      16.5 mm de pasillo entre las dos columnas, para el mazo que une la pila
      con el payload sin cruzar por delante del telescopio.

  - id: z_banco_libre
    nombre: Banco optico de espacio libre
    caja:
      min: [-108.25, -45.1, -80.0]
      max: [108.25, 45.1, -20.0]
    nota: >-
      Colimador, dicroico, FSM y camara de beacon, mas PCB-3 (PAT), que va aqui
      para que el driver del FSM y la lectura de camara sean recorridos cortos.
      Camino: colimador -> dicroico -> FSM -> telescopio, y dicroico -> camara.

  - id: z_bandeja_optica
    nombre: Bandeja optica de fibra
    caja:
      min: [-108.25, -45.1, -178.1]
      max: [108.25, -5.0, -80.0]
    nota: >-
      Placa mecanica en la mitad -Y de la banda de -Z. Los dos moduladores se
      orientan segun X: necesitan 130 mm rectos cada uno (cota de plano de Exail
      con protectores de fibra) y solo X y Z los admiten. Zona con control
      termico propio: 0 a +70 C por la extincion del modulador.

  - id: z_pcb_payload
    nombre: Cubierta de electronica del payload
    caja:
      min: [-108.25, -5.0, -178.1]
      max: [108.25, 45.1, -80.0]
    nota: >-
      PCB-2 (drivers opticos) montada como cubierta sobre la bandeja, para que
      los coaxiales RF a los moduladores bajen en vertical y sean lo mas cortos
      posible. Tambien aloja las baterias si el presupuesto de energia pide mas
      de dos modulos, por quedar lejos del laser y del telescopio.

# ---------------------------------------------------------------------
# KEEP-OUTS (volumenes reservados)
# ---------------------------------------------------------------------
# Vacio hasta que se confirme la distribucion y lleguen los diametros de haz,
# el radio de curvatura de la fibra y las holguras de conector. Declarar un
# keep-out con medidas inventadas daria una falsa sensacion de comprobacion.
keep_out: []

# ---------------------------------------------------------------------
# COLOCACIONES
# ---------------------------------------------------------------------
# VACIO A PROPOSITO. Se rellena cuando el equipo confirme la distribucion.
# Formato:
#   - componente: adcs_iadcs400
#     instancia: 1
#     centro: [x, y, z]          # mm, centro de la pieza
#     rotacion: [rx, ry, rz]     # grados, aplicados en orden X, Y, Z
#     zona: z_pila_pc104
colocaciones: []
