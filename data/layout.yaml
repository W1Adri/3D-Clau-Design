# =====================================================================
# CLAU - Distribucion dentro del 6U
# ---------------------------------------------------------------------
# ESTADO: CONFIRMADA (opcion "dos columnas de 3U", elegida el 2026-09-20).
#
# GENERADO por tools/generar_layout.py. No editar a mano: ninguna
# coordenada se escribe, todas salen de data/components.yaml.
#   uv run python tools/generar_layout.py
#
# Coordenadas CDS Rev 14.1: origen en el centro geometrico del 6U.
#   X: +-113.15 mm (ancho, 226.3)
#   Y: +-50.00  mm (alto,  100.0)
#   Z: +-183.00 mm (largo, 366.0). La cara -Z entra primero.
# Zona util interior: 221.7 x 95.4 x 361.4 mm.
#
# Reparto: dos columnas a lo largo de TODO Z.
#   X < -10.85 mm -> plataforma (100.0 mm de ancho)
#   X > -10.85 mm -> payload (121.7 mm de ancho)
# En la zona del telescopio el payload se parte otra vez en X:
#   X > +84.55 mm -> franja de moduladores (26.3 mm)
# =====================================================================

meta:
  estado: confirmada
  fecha: 2026-09-20
  nota: >-
    Dos columnas de 3U a lo largo de todo Z. La pila PC104 queda holgada:
    305 mm usados de 361 mm. La columna de payload mide
    121.7 mm de ancho y se parte en dos a lo largo del telescopio:
    95.4 mm para el barrilete y 26.3 mm de franja lateral, donde van
    los dos moduladores tumbados segun Z. Asi la bandeja se queda sin
    cuerpos dentro y el telescopio puede reservar 200 mm. PCB-2 sigue
    en la otra columna, con lo que el coaxial RF cruza el satelite a lo
    ancho.

zonas:
  - id: z_plataforma
    nombre: "Columna de plataforma - pila PC104 a lo largo de todo Z"
    caja:
      min: [-110.85, -47.70, -180.70]
      max: [-10.85, 47.70, 180.70]
    nota: >-
      ADCS en +Z, para que el star tracker ST200 mire por la misma cara
      que el telescopio. Despues OBC, EPS, radio banda S, PCB-3, PCB-1 y
      PCB-2, y las baterias al final de -Z, que equilibran en Z la masa
      del telescopio, y la antena de banda S detras de ellas, contra la
      pared -Z, que es la unica cara con hueco. La pila usa 305 mm de los
      361 mm disponibles. Cada ranura se mide sobre la geometria DIBUJADA,
      no sobre la altura de ficha: las fichas AAC no incluyen el conector
      PC104 pasante y los STEP si. Las tres PCBs propias se dibujan con
      una altura SUPUESTA de 15 mm.

  - id: z_payload_telescopio
    nombre: "Telescopio"
    caja:
      min: [-10.85, -47.70, -19.30]
      max: [84.55, 47.70, 180.70]
    nota: >-
      Telescopio Cassegrain apuntando por +Z. 200 mm RESERVADOS en Z (dato
      'longitud_reservada', estado decision, provisional hasta el STEP).
      OJO: los "~2U" del brief son ~227 mm con la U de longitud de la CDS
      (113.5 mm), no 200. Esta zona mide 95.4 mm en X, que es el mayor
      diametro de barrilete que cabe en la altura interior. El barrilete
      se dibuja LLENANDO la zona, porque su envolvente es una cota
      superior y no una medida: asi se ve que con 90 mm de apertura libre
      no queda sitio para barrilete, celda ni ajuste. En cuanto llegue el
      STEP, sustituye al cilindro sin tocar nada.

  - id: z_payload_franja
    nombre: "Franja lateral - moduladores"
    caja:
      min: [84.55, -47.70, -19.30]
      max: [110.85, 47.70, 180.70]
    nota: >-
      Los 26.3 mm de X que quedan al lado del telescopio, a lo largo de
      toda su longitud. Aqui van los dos moduladores tumbados (9.7 mm por
      X, 15 mm por Y, 110 mm por Z), pegados al extremo -Z para acortar la
      fibra hasta la bandeja. El ancho no se ha elegido: el barrilete no
      puede pasar de los 95.4 mm de altura interior, asi que esta franja
      existe para cualquier diametro que permita montar el telescopio.

  - id: z_payload_banco
    nombre: "Banco optico de espacio libre"
    caja:
      min: [-10.85, -47.70, -74.30]
      max: [110.85, 47.70, -19.30]
    nota: >-
      Camino: colimador -> dicroico -> FSM -> telescopio, y del dicroico
      sale el brazo del beacon hacia +-Y (camara arriba, laser de beacon
      de bajada abajo). El FSM esta sobre el eje optico del telescopio (X
      = +36.85) porque es el que dobla el haz de X a Z, y eso deja el
      colimador y el dicroico en linea hacia +X. Margen contra la pared
      +X: -0.5 mm. Los haces NO estan dibujados: sin diametro de haz, un
      keep-out optico seria una medida inventada.

  - id: z_payload_bandeja
    nombre: "Bandeja optica de fibra"
    caja:
      min: [-10.85, -47.70, -180.70]
      max: [110.85, 47.70, -74.30]
    nota: >-
      106.4 mm de Z con los 121.7 mm de ancho enteros, ya sin cuerpos de
      modulador dentro. La cadena va en filas que avanzan segun Z, en el
      orden y el sentido de la cadena optica: el laser DFB al extremo -Z,
      lo mas lejos posible del barrilete porque con sus 4.1 W es la
      principal fuente de calor del payload, y la salida hacia el
      colimador en +Z. Quedan 15.6 mm de Z libres al final para los
      bucles, mas los huecos entre filas. Cuanta fibra cabe ahi NO se
      puede decir: falta el radio minimo de curvatura. Zona con control
      termico propio.

# Volumenes reservados. TODOS salen de numeros SUPUESTOS: el radio
# minimo de curvatura de la fibra, el del coaxial y el diametro de haz
# siguen siendo TBD. Por eso cada uno lleva su estado y su fuente, y
# por eso invadir uno NO tumba el codigo de salida de `clau3d informe`:
# no es un choque de geometrias, es la consecuencia de una hipotesis.
keep_out:
  - id: fibra_laser_dfb_1550_salida
    tipo: fibra
    estado: supuesto
    fuente: >-
      Tramo recto de 20 mm (integracion.fibra.longitud_boot_modelada)
      mas el envolvente de un codo de 30 mm
      (integracion.fibra.radio_curvatura_modelado). Los dos son
      SUPUESTOS: el radio de verdad es
      integracion.fibra.radio_minimo_curvatura, que sigue siendo TBD. La
      DIRECCION tampoco es un dato: se toma el eje de fibra que declara
      'montaje', porque el encaminamiento real esta sin decidir.
    caja:
      min: [68.7, -40.8, -180.7]
      max: [110.85, 19.2, -123.05]
