# =====================================================================
# CLAU - Distribucion dentro del 6U
# ---------------------------------------------------------------------
# ESTADO: CONFIRMADA (opcion "dos columnas de 3U", elegida el 2026-09-20).
#
# GENERADO por tools/generar_layout.py. No editar a mano: ninguna
# coordenada se escribe, todas salen de data/components.yaml.
#   uv run python tools/generar_layout.py
#
# Coordenadas CDS Rev 14.1: origen en el centro geometrico del 6U.
#   X: +-113.15 mm (ancho, 226.3)
#   Y: +-50.00  mm (alto,  100.0)
#   Z: +-183.00 mm (largo, 366.0). La cara -Z entra primero.
# Zona util interior: 221.7 x 95.4 x 361.4 mm.
#
# Reparto: dos columnas a lo largo de TODO Z.
#   X < -10.85 mm -> plataforma (100.0 mm de ancho)
#   X > -10.85 mm -> payload (121.7 mm de ancho)
# =====================================================================

meta:
  estado: confirmada
  fecha: 2026-09-20
  nota: >-
    Dos columnas de 3U a lo largo de todo Z. La pila PC104 queda holgada:
    259 mm usados de 361 mm. A cambio la columna de payload mide
    121.7 mm de ancho, donde los 130 mm de recorrido recto de
    cada modulador no caben segun X, asi que van segun Z. Y PCB-2 queda
    en la otra columna, con lo que el coaxial RF a los moduladores cruza
    el satelite a lo ancho.

zonas:
  - id: z_plataforma
    nombre: "Columna de plataforma - pila PC104 a lo largo de todo Z"
    caja:
      min: [-110.85, -47.70, -180.70]
      max: [-10.85, 47.70, 180.70]
    nota: >-
      ADCS en +Z, para que el star tracker ST200 mire por la misma cara
      que el telescopio. Despues OBC, EPS, radio banda S, PCB-3, PCB-1 y
      PCB-2, y las baterias al final de -Z, que equilibran en Z la masa
      del telescopio. La pila usa 259 mm de los 361 mm disponibles. Las
      tres PCBs propias tienen posicion de separador reservada pero no se
      dibujan: su altura es TBD.

  - id: z_payload_telescopio
    nombre: "Telescopio"
    caja:
      min: [-10.85, -47.70, 20.70]
      max: [110.85, 47.70, 180.70]
    nota: >-
      Telescopio Cassegrain apuntando por +Z. 160 mm de longitud
      reservados, menos que los ~2U del brief: en esta distribucion la
      bandeja necesita recorrido en Z y sale de aqui. Su envolvente es TBD
      y no se dibuja.

  - id: z_payload_banco
    nombre: "Banco optico de espacio libre"
    caja:
      min: [-10.85, -47.70, -34.30]
      max: [110.85, 47.70, 20.70]
    nota: >-
      Colimador, dicroico, FSM y camara de beacon. Camino: colimador ->
      dicroico -> FSM -> telescopio, y dicroico -> camara.

  - id: z_payload_bandeja
    nombre: "Bandeja optica de fibra"
    caja:
      min: [-10.85, -47.70, -180.70]
      max: [110.85, 47.70, -34.30]
    nota: >-
      Los dos moduladores van tumbados a lo largo de Z: con 121.7 mm de
      ancho de columna no caben los 130 mm de recorrido recto segun X.
      Zona con control termico propio: 0 a +70 C por la extincion del
      modulador.

# Vacio hasta que lleguen los diametros de haz, el radio de curvatura de
# la fibra y las holguras de conector. Declarar un keep-out con medidas
# inventadas daria una falsa sensacion de comprobacion.
keep_out: []

colocaciones:
  - componente: adcs_iadcs400
    instancia: 1
    centro: [-60.85, 0.0, 142.6]
    rotacion: [0, 0, 90]
    zona: z_plataforma
