# ---------------------------------------------------------------------
# 6. PARAMETROS DE INTEGRACION (no son componentes)
# ---------------------------------------------------------------------
integracion:
  pila_pc104:
    contorno:
      valor: [95.89, 90.17]
      unidad: mm
      estado: confirmado
      fuente: Fichas AAC (Kryten-M3, Starbuck-Nano, Optimus) - contorno comun
      nota: Contorno de tarjeta comun a toda la gama AAC usada en CLAU.
    paso_apilamiento:
      valor: null
      unidad: mm
      estado: TBD
      falta: Paso real entre tarjetas (separadores) del chasis elegido
      pedir_a: Equipo de estructura de ACSAR
      nota: >-
        El paso NO es la altura de la ficha: las fichas AAC dan la altura "from
        top PCB to lowest component". El paso lo fijan los separadores.
        Sin este dato no se puede cerrar la longitud de la pila.
    paso_apilamiento_modelado:
      valor: 15.24
      unidad: mm
      estado: referencia
      fuente: https://pc104.org/wp-content/uploads/2015/02/PC104_Spec_v2_6.pdf
      nota: >-
        Paso estandar PC/104: 0.600 in = 15.24 mm, con separadores de
        0.600 in +/-0.005 in. Se usa para modelar la pila mientras no llegue el
        paso real del chasis. Una tarjeta mas alta que el paso ocupa varias
        posiciones de separador: ceil(altura / paso) posiciones.
  fibra:
    radio_minimo_curvatura:
      valor: null
      unidad: mm
      estado: TBD
      falta: Radio minimo de curvatura de la fibra elegida (probablemente PM a 1550 nm)
      pedir_a: Equipo de payload de ACSAR
      nota: >-
        Es el parametro que mas area consume en la bandeja optica. Sin el no se
        puede dimensionar la bandeja ni comprobar los bucles. Mientras falte,
        los keep-outs se dibujan con 'radio_curvatura_modelado', que es un
        numero inventado.
    radio_curvatura_modelado:
      valor: 30.0
      unidad: mm
      estado: supuesto
      fuente: >-
        SUPUESTO. Valor provisional acordado para poder dibujar los keep-outs
        de fibra. Esta en el rango conservador de lo que se suele exigir a
        fibra monomodo de 1550 nm (del orden de 10 a 30 mm segun fabricante y
        segun si el criterio es perdida por macrocurvatura o vida en
        fatiga), pero NO sale de ninguna ficha: la fibra no esta elegida.
        Con este valor la bandeja NO cumple; ver el chequeo 'bucles_fibra' y
        las invasiones de keep-out del informe de interferencias.
      falta: Radio minimo de curvatura real, que es 'radio_minimo_curvatura'
      pedir_a: Equipo de payload de ACSAR
      nota: >-
        Mismo patron que 'paso_apilamiento_modelado': un valor de trabajo al
        lado del hueco de verdad, no en su lugar.
    empalme:
      valor: fusion
      estado: decision
      fuente: >-
        Decision de ACSAR (Adri), 2026-09-21, analisis de polarizacion del
        transmisor BB84. TODOS los tramos de fibra del camino cuantico van por
        EMPALME POR FUSION: CERO CONECTORES. Tres motivos, y los tres son del
        enlace, no del montaje. (1) Un conector es una interfaz
        desmontable y por tanto una entrada para luz de TROYA y un punto de
        retrorreflexion hacia el DFB. (2) Un conector PM tiene una tolerancia
        de alineacion angular de los ejes que un empalme por fusion no tiene, y
        cada grado de desalineacion es diafonia entre los dos ejes. (3) Un
        conector se puede mover con la vibracion del lanzamiento, y lo que se
        mueve en polarizacion no vuelve solo a su sitio.
        LO QUE CUESTA: la bandeja y la franja dejan de ser desmontables pieza a
        pieza. Una vez fusionada, la cadena se monta y se desmonta entera.
      nota: >-
        Esto sustituye al hueco 'conector' que cada tramo f0x llevaba en
        data/connections.yaml. Lo que sigue faltando no es el tipo de union,
        que ya esta decidido, sino el PROTECTOR de empalme:
        'longitud_protector_empalme'.
    longitud_protector_empalme:
      valor: 60.0
      unidad: mm
      estado: supuesto
      fuente: >-
        SUPUESTO. Tramo RECTO que hay que reservar por cada empalme por fusion:
        el protector (la ferula termorretractil con su varilla metalica) NO SE
        PUEDE CURVAR, y el tramo inmovilizado es mas largo que el protector
        mismo. Los protectores habituales miden 40-60 mm y hay que dejar algo a
        cada lado, asi que 60 mm es el orden correcto del tramo RIGIDO total.
        NO sale de ninguna ficha: no hay protector elegido.
        ES EL NUMERO QUE DECIDE SI EL TRAMO POST-CODIFICACION CABE: el empalme
        entre el codificador y el colimador es el unico que cae en un tramo que
        ademas tiene que ser recto, asi que sus 60 mm se suman enteros a la
        longitud que hay que reservar en la franja. Ver el chequeo
        'fibra_post_codificacion'.
      falta: Protector de empalme elegido y su tramo recto real
      pedir_a: Equipo de payload de ACSAR
    sensibilidad_termica_fase_pm:
      valor: null
      unidad: rad/(m*K)
      estado: TBD
      falta: >-
        SENSIBILIDAD TERMICA DE LA FASE ENTRE LOS DOS EJES DE LA FIBRA PM,
        MEDIDA, en rad por metro y por kelvin. Es lo que fija CUANTA FIBRA
        POST-CODIFICACION ES TOLERABLE, y por tanto si el tramo recto que el
        layout reserva sirve o hay que acortarlo todavia mas.
        Por que importa solo despues del codificador: antes, la luz va en
        polarizacion lineal fija alineada al eje lento, que ES un autoestado de
        la fibra, y la birrefringencia no le hace nada. Despues, los estados
        diagonales (y los circulares) viajan a 45 grados de los ejes, NO son
        autoestados, y la birrefringencia les mete una fase proporcional a la
        longitud que ademas DERIVA CON LA TEMPERATURA. El resultado seria una
        base limpia y la otra rota, que es la peor forma de fallar: el enlace
        parece funcionar.
      pedir_a: Equipo de payload de ACSAR (medida, no ficha)
      nota: >-
        Mientras falte, el chequeo 'fibra_post_codificacion' informa de la
        longitud del tramo pero su veredicto sobre si esa longitud es
        aceptable sale como NO COMPROBABLE, nunca como ok.
    tolerancia_coaxialidad:
      valor: 0.5
      unidad: mm
      estado: supuesto
      fuente: >-
        SUPUESTO. Cuanto se admite que el eje de fibra del codificador se
        aparte del eje del colimador antes de decir que el tramo ya no es
        recto. Medio milimetro sobre un tramo de decenas de milimetros es un
        angulo de pocos miliradianes, que una abrazadera en V corrige; mas que
        eso obliga a curvar la fibra, y curvar es lo que este tramo tiene
        prohibido. NO sale de ninguna ficha: depende del colimador elegido, de
        su apertura de acoplamiento y del utillaje de alineacion.
      falta: >-
        Tolerancia de alineacion del colimador elegido, y presupuesto de
        alineacion del montaje
      pedir_a: Equipo de optica / de payload de ACSAR
      nota: >-
        Es la tolerancia que usa el chequeo 'fibra_post_codificacion' para
        decir si el colimador y el codificador siguen siendo coaxiales despues
        de colocarlos. No es una tolerancia de fabricacion.
    longitud_boot_modelada:
      valor: 20.0
      unidad: mm
      estado: supuesto
      fuente: >-
        SUPUESTO. Tramo RECTO que hay que dejar a la salida de cada conector o
        protector de fibra antes de empezar a curvar. Valor provisional
        acordado; no sale de ninguna ficha porque no hay conector elegido.
      falta: Tipo de conector o protector y su tramo recto de salida
      pedir_a: Equipo de payload de ACSAR
  coaxial:
    radio_curvatura_modelado:
      valor: 25.0
      unidad: mm
      estado: supuesto
      fuente: >-
        SUPUESTO. Reserva para curvar el coaxial RF a la salida del conector
        del modulador. No sale de ninguna ficha: el cable no esta elegido, y
        para un coaxial semirrigido el radio real puede ser bastante mayor.
      falta: >-
        Radio minimo de curvatura del coaxial elegido. Es el mismo hueco que
        'cables_rf_moduladores.radio_minimo_curvatura'.
      pedir_a: Equipo de electronica de ACSAR
  optica:
    diametro_haz_modelado:
      valor: 10.0
      unidad: mm
      estado: supuesto
      fuente: >-
        SUPUESTO. Diametro del tubo que se reserva libre para los haces en
        espacio libre del banco. No sale de ningun calculo optico: el diametro
        de haz colimado es TBD en cada tramo de data/connections.yaml. Se toma
        un valor unico y generoso para que el keep-out se vea y estorbe si algo
        se mete en el camino; el de verdad saldra del diseno optico.
      falta: >-
        Diametro de haz de cada tramo (e01 a e05 en data/connections.yaml) y el
        semiangulo del cono de la apertura
      pedir_a: Equipo de optica de ACSAR
    punto_de_adelanto:
      valor: 50.7
      unidad: urad
      estado: supuesto
      fuente: >-
        SUPUESTO, calculado, no medido: el punto de adelanto de un enlace
        optico es 2v/c, y con v = 7.6 km/s (velocidad orbital tipica de un LEO
        bajo) salen 50.7 urad. El valor que de verdad haya que cubrir depende
        de la geometria de cada pase y de la orbita, que no estan en este
        catalogo.
      falta: >-
        Punto de adelanto maximo del enlace, del analisis de mision (orbita y
        geometria de los pases)
      pedir_a: Equipo de PAT / de mision de ACSAR
      nota: >-
        Es lo que el FSM tiene que poder desviar. Un afocal comprime los
        angulos por M, asi que en el haz comprimido, que es donde esta el FSM,
        el mismo adelanto son 50.7 * M urad opticos, o la mitad en giro
        mecanico del espejo. Ver el chequeo 'haz_vs_fsm'.
        EL BEACON DE BAJADA COMPARTE EL FSM con el canal cuantico: sale por
        D2, vuelve a D1 y se refleja al mismo espejo, asi que recibe el MISMO
        punto de adelanto. Es lo que se quiere -- el beacon tiene que llegar
        adonde ESTARA la estacion, no donde se la ve --, pero tiene una
        consecuencia que hay que tener presente: la camara ve el beacon de
        subida en la direccion de RETORNO, sin adelantar, mientras el FSM
        trabaja adelantado, asi que entre lo que se recibe y lo que se
        transmite hay siempre ese desfase. Queda ESCRITO, no implementado: el
        lazo de control del FSM no esta en este repositorio.
    longitud_onda_beacon_subida:
      valor: 976.0
      unidad: nm
      estado: decision
      fuente: >-
        Decision de arquitectura de ACSAR del 2026-09-20. El beacon que sube de
        la estacion al satelite va en 976 nm porque el sensor que lo mide es un
        CMOS de silicio, y el silicio tiene eficiencia cuantica decente a 976 nm
        y esta practicamente ciego a 1064 nm (por debajo del 1 %). Esa ceguera
        es la que regala dos o tres ordenes de magnitud de rechazo del beacon de
        bajada ENCIMA de lo que da el filtro de banda estrecha, y es lo que
        permite que los dos beacons compartan brazo y dicroicos sin que los
        100 mW que salen deslumbren al sensor que mide microvatios que entran.
      nota: >-
        Invertir la asignacion (subida en 1064, bajada en 976) pierde ese
        aislamiento y obliga a una camara InGaAs, que es mas cara, mas pesada y
        con mas ruido. Ver 'longitud_onda_beacon_bajada'.
    longitud_onda_beacon_bajada:
      valor: 1064.0
      unidad: nm
      estado: decision
      fuente: >-
        Decision de arquitectura de ACSAR del 2026-09-20. El beacon que baja del
        satelite a la estacion va en 1064 nm por dos motivos. Arriba: es a lo
        que el CMOS de silicio de la camara de seguimiento esta ciego (ver
        'longitud_onda_beacon_subida'), asi que el propio sensor rechaza el
        beacon propio. Abajo: 1064 nm es la linea del Nd:YAG, de las mas
        instrumentadas que hay, y en tierra se detecta con APD de silicio --
        que a 1064 todavia responde lo justo y hay detectores comerciales de
        sobra -- o con InGaAs, donde el tamano y el consumo no son problema.
      nota: >-
        Separado del 1550 del canal cuantico lo suficiente para que D1 sea un
        paso largo comodo, y separado del 976 lo suficiente para que D2 lo sea
        tambien.
    potencia_beacon_bajada:
      valor: 100.0
      unidad: mW
      estado: supuesto
      fuente: >-
        SUPUESTO. Orden de magnitud tipico del beacon de bajada de un terminal
        optico de CubeSat; NO sale de ningun presupuesto de enlace de CLAU, que
        no existe todavia. Se declara porque es lo que dimensiona el disipador
        del laser (y con el su envolvente) y lo que decide cuanto aislamiento
        hace falta entre el beacon que sale y el canal cuantico que entra.
      falta: >-
        Potencia optica de bajada del presupuesto de enlace (divergencia,
        distancia, sensibilidad del receptor de la estacion)
      pedir_a: Equipo de PAT / de mision de ACSAR
    borde_dicroico_d1:
      valor: 1300.0
      unidad: nm
      estado: supuesto
      fuente: >-
        SUPUESTO. Borde de un paso largo que tiene que transmitir 1550 nm y
        reflejar 976 y 1064: cualquier valor entre ~1100 y ~1400 nm lo cumple, y
        1300 nm es el centro de esa ventana, lo mas lejos posible de los dos
        lados. NO sale de ninguna ficha: D1 no esta elegido.
      falta: >-
        Longitud de onda de corte, anchura de la transicion y curvas de
        transmision y reflexion del divisor elegido
      pedir_a: Equipo de optica de ACSAR
    borde_dicroico_d2:
      valor: 1020.0
      unidad: nm
      estado: supuesto
      fuente: >-
        SUPUESTO. Borde de un paso corto que tiene que transmitir 976 nm y
        reflejar 1064: la ventana es de 88 nm y 1020 nm es su centro. Es una
        transicion ESTRECHA, y esa estrechez es el precio de meter los dos
        beacons en el mismo brazo. NO sale de ninguna ficha: D2 no esta
        elegido.
      falta: >-
        Longitud de onda de corte, anchura de la transicion y curvas de
        transmision y reflexion del divisor elegido
      pedir_a: Equipo de optica de ACSAR
      nota: >-
        Si ningun divisor comercial da esa transicion con el rechazo que haga
        falta, la salida no es apretar el borde: es separar mas las dos
        longitudes de onda, y eso vuelve a abrir
        'longitud_onda_beacon_subida'.
    aislamiento_camara_a_1064:
      valor: null
      unidad: dB
      estado: TBD
      falta: >-
        Aislamiento total medido del beacon de bajada (1064 nm, 100 mW) en el
        sensor de la camara de seguimiento: la suma de la reflexion de D2, el
        filtro de banda estrecha de 976 nm y la ceguera del silicio a 1064.
      pedir_a: Equipo de PAT de ACSAR
      nota: >-
        ES EL NUMERO QUE SOSTIENE TODA LA ELECCION DE LONGITUDES DE ONDA, y hoy
        no esta medido. Lo que decide es si un sensor que mide microvatios de
        beacon de subida puede convivir en el mismo brazo con 100 mW de beacon
        de bajada. Si sale corto, las salidas son separar mas los dos colores,
        apagar el beacon durante la lectura de la camara, o volver a dos brazos
        separados -- y esta ultima ya se sabe que no cabe en el banco.
    geometria_del_brazo_de_beacons:
      valor: null
      estado: TBD
      falta: >-
        DECIDIR COMO CABE EL BRAZO. Con los dos beacons compartiendo brazo, la
        fila D1/2 + D2 + camara pide 54.5 mm desde el centro de D1 y solo hay
        47.7 mm hasta la pared del banco: FALTAN 6.8 mm con las envolventes
        desnudas y 16.8 mm con holguras de montaje, y por eso 'camara_beacon'
        no esta colocada en data/layout.yaml. Ya esta aplicada la unica salida
        que no le cuesta volumen a nadie (bajar la reserva de la camara de 30 a
        20 mm). Quedan dos, y las dos se pagan:
        (1) PLEGAR EL BRAZO HACIA -Z con un espejo de doblado. Da unos 27.5 mm
        mas -- la mitad de los 55 mm de banco en Z -- a costa de una superficie
        reflectante adicional en el camino del beacon y de una pieza mas que
        alinear.
        (2) ALARGAR EL BANCO, que hoy mide 55 mm en Z. Se paga con la bandeja de
        fibra o con 'telescopio_cassegrain.longitud_reservada', exactamente
        igual que la salida de la linea en X (CLAUDE.md 3.7).
        Lo que NO es una salida es seguir bajando reservas hasta que el chequeo
        pase: las del brazo ya son todas cotas superiores.
      pedir_a: ACSAR (mecanica y optica)
      nota: >-
        Es lo unico que hoy hace que 'clau3d informe' devuelva codigo 1. Ver el
        chequeo 'brazo_beacon' y CLAUDE.md 3.9.
    lamina_cuarto_onda_fija:
      valor: null
      estado: TBD
      falta: >-
        QUE PAR DE BASES USA EL ENLACE, que es lo que decide si hace falta una
        lamina de cuarto de onda fija. Dos opciones, y las dos son validas para
        BB84:
        (a) SIN LAMINA: el esquema ICFO de un solo modulador de fase entrega de
        forma natural las bases D/A y R/L (diagonal y circular). No hace falta
        ninguna pieza mas, y el camino cuantico no gana ninguna superficie.
        (b) CON LAMINA: una lamina de cuarto de onda fija a 45 grados DESPUES
        del codificador convierte esas bases en H/V y D/A, que es el par
        clasico y el que muchas estaciones de tierra tienen ya montado.
        BB84 solo necesita dos bases mutuamente insesgadas, y los dos pares lo
        son, asi que esto NO es una decision de fisica del protocolo: es una
        decision de COMPATIBILIDAD CON LA ESTACION DE TIERRA.
      pedir_a: Equipo de optica de ACSAR / Equipo de estacion de tierra
      nota: >-
        NO SE DIBUJA NI SE COLOCA, y por eso esta aqui y no como componente: lo
        que esta en duda es SI LA PIEZA EXISTE. Un componente en el catalogo
        que quiza no este en el camino o no tiene conexiones declaradas -- y
        entonces es una pieza suelta, que es justo lo que
        tests/test_brazo_beacon.py existe para cazar -- o las tiene y el modelo
        afirma un camino optico que nadie ha decidido. Un hueco se queda como
        hueco, y este hueco es una decision, no una envolvente.
        SI SE DECIDE (b): la lamina va en espacio libre entre el colimador y el
        espejo de plegado, y ENTONCES se da de alta como componente con su
        id_drive, su envolvente y sus dos tramos. Reservar sitio hoy seria
        reservarlo para algo que puede no existir.
    perdida_obstruccion_convenio:
      valor: intensidad_en_eje
      estado: decision
      fuente: >-
        Decision de ACSAR del 2026-09-20. La obstruccion central de un
        Cassegrain da DOS cifras distintas, las dos en potencia, y confundirlas
        cuesta un factor 2 en dB:
        (a) fraccion de POTENCIA recogida = 1 - eps^2, o sea -10 log10(1-eps^2);
        (b) INTENSIDAD EN EJE en campo lejano = (1 - eps^2)^2, o sea
        -20 log10(1-eps^2), porque la obstruccion no solo quita area sino que
        redistribuye energia del lobulo principal a los anillos.
        Para un enlace optico manda (b): lo que llega al receptor es la
        intensidad en el eje, no la potencia total que sale del telescopio. Las
        dos se derivan y se publican por separado en
        src/clau3d/optica/parametros.py ('perdida_potencia_recogida_dB' y
        'perdida_intensidad_en_eje_dB'); aqui solo se declara CUAL manda,
        porque los numeros se derivan de eps y escribirlos aqui seria
        duplicarlos.
      nota: >-
        Esto corrige un comentario anterior del codigo que llamaba al -20 log10
        "convenio de amplitud" y decia que en potencia costaba la mitad de dB.
        Era falso: no son dos convenios de la misma magnitud, son dos
        magnitudes distintas y las dos son de potencia.
  holgura_conector:
    valor: null
    unidad: mm
    estado: TBD
    falta: Holgura de insercion por tipo de conector (coaxial RF, AVIM optico, conectores de datos)
