      fabricacion, recto y sin curvas. Ver CLAUDE.md 3.10.
      CUIDADO CON LA DERIVA TERMICA: la birrefringencia estatica TE/TM del
      niobato de litio es grande y depende de la temperatura, asi que el "cero"
      del codificador -- el punto en que las dos componentes salen en fase --
      SE MUEVE CON T. Eso obliga a control termico propio o a calibracion
      continua contra la estacion, y es independiente del control termico que
      ya pide el MXER por su razon de extincion.

  - id: voa
    id_drive: OPT-04
    referencia_comercial: null
    nombre: Atenuador optico variable (VOA)
    categoria: payload_bandeja
    subsistema: bandeja_optica
    cantidad: 1
    montaje:
      cara: "-Z"
      eje: X
      tipo_eje: fibra
      nota: Componente en linea. Se fija con abrazadera a la bandeja.
    forma:
      tipo: cilindro
      eje: X
      dimensiones:
        valor: [35.0, 5.5, 5.5]
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Encapsulado cilindrico en linea tipico de los componentes
          pasivos de fibra de telecomunicaciones (del orden de 5.5 mm de
          diametro por 35-40 mm de cuerpo). NO es ningun producto: no hay
          candidato elegido, asi que no hay ficha que copiar. Sirve para
          reservar un volumen del orden correcto en la bandeja y para que el
          recorrido de fibra tenga extremos donde apoyarse. La cifra real
          cambiara, y puede cambiar mucho si se elige un encapsulado en caja.
        falta: Modelo de VOA elegido y su envolvente
        pedir_a: Equipo de payload de ACSAR
    nota: >-
      Lleva el flujo al nivel de fotones por pulso exigido por BB84 con decoy.
      SIN CANDIDATO: la envolvente que se dibuja es una reserva, no una pieza.
      VA ANTES DEL CODIFICADOR POR LA PDL. Todo componente de fibra tiene
      PERDIDA DEPENDIENTE DE LA POLARIZACION, y un atenuador variable la tiene
      por construccion: atenua unos estados mas que otros. Puesto detras del
      codificador, eso DEFORMA el conjunto BB84 -- los cuatro estados dejan de
      tener la misma intensidad -- y se lo regala a un atacante. Puesto delante,
      la luz va en una sola polarizacion fija y la PDL es una perdida constante
      mas, sin ninguna consecuencia. Y no cuesta nada ponerlo delante: la
      atenuacion es LINEAL, asi que da igual en que punto de la cadena se haga.
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa del VOA elegido
      pedir_a: Equipo de payload de ACSAR

  - id: atenuador_fijo
    id_drive: OPT-04-ALT
    referencia_comercial: null
    nombre: Atenuador fijo calibrado en tierra (alternativa al VOA)
    categoria: payload_bandeja
    subsistema: bandeja_optica
    # EXCLUYENTE con el VOA, igual que 'trampa_luz_d2' lo es con el fotodiodo
    # de monitor: o va uno o va el otro, nunca los dos. Por eso no suma en
    # ningun presupuesto y el generador no lo coloca.
    alternativa_de: voa
    cantidad: 1
    montaje:
      cara: "-Z"
      eje: X
      tipo_eje: fibra
      nota: Componente en linea, igual que el VOA al que sustituiria.
    forma:
      tipo: cilindro
      eje: X
      dimensiones:
        valor: [25.0, 5.5, 5.5]
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Encapsulado cilindrico en linea de un atenuador FIJO, que
          es mas corto que el variable porque no lleva ni actuador ni
          electronica: solo el elemento atenuante y los dos empalmes. NO es
          ningun producto. Se declara para que la alternativa se pueda comparar
          en volumen, no para dibujarla: al ser excluyente no se coloca.
        falta: Modelo de atenuador fijo elegido y su envolvente
        pedir_a: Equipo de payload de ACSAR
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa del atenuador fijo elegido
      pedir_a: Equipo de payload de ACSAR
    nota: >-
      ALTERNATIVA EXCLUYENTE AL VOA, no una pieza adicional. Lo que compra:
      NO TIENE PARTES MOVILES. Los VOA de fibra habituales son MEMS o de
      motor, y las dos familias meten un mecanismo en el camino cuantico, con
      lo que eso significa en lanzamiento y en vida en orbita. El ajuste fino
      del flujo lo haria el MXER con sus niveles, que ya tiene que producirlos
      con precision para el metodo de decoy, asi que la atenuacion gruesa puede
      ser un valor fijo calibrado en tierra.
      LO QUE CUESTA: el valor queda fijado antes del lanzamiento. Si el
      presupuesto de enlace cambia en orbita -- degradacion del laser, otra
      estacion, otro angulo de pase -- no hay forma de recuperar el margen por
      aqui, y todo el rango de ajuste tiene que salir del MXER.
      LA DECISION ES DE ACSAR y depende de cuanto rango de ajuste necesite el
      enlace, que es un dato que no existe todavia.

  - id: aislador
    id_drive: OPT-05
    referencia_comercial: null
    nombre: Aislador optico
    categoria: payload_bandeja
    subsistema: bandeja_optica
    cantidad: 1
    montaje:
      cara: "-Z"
      eje: X
      tipo_eje: fibra
      nota: Componente en linea. Tiene sentido de paso; orientar segun la cadena.
    forma:
      tipo: cilindro
      eje: X
      dimensiones:
        valor: [35.0, 5.5, 5.5]
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Encapsulado cilindrico en linea tipico de los componentes
          pasivos de fibra de telecomunicaciones (del orden de 5.5 mm de
          diametro por 35-40 mm de cuerpo). NO es ningun producto: no hay
          candidato elegido, asi que no hay ficha que copiar. Sirve para
          reservar un volumen del orden correcto en la bandeja y para que el
          recorrido de fibra tenga extremos donde apoyarse. La cifra real
          cambiara, y puede cambiar mucho si se elige un encapsulado en caja.
        falta: Modelo de aislador elegido y su envolvente
        pedir_a: Equipo de payload de ACSAR
    tipo:
      valor: PM_doble_etapa
      estado: decision
      fuente: >-
        Decision de ACSAR (Adri), 2026-09-21, analisis de polarizacion del
        transmisor BB84. Aislador PM -- transmite el eje lento, que es el eje al
        que va alineada la polarizacion lineal fija de todo el tramo
        pre-codificacion -- y de DOBLE ETAPA. Doble etapa por las dos funciones
        que cumple: proteger el DFB de retrorreflexiones (una sola etapa no da
        margen suficiente con los dos moduladores detras) y ser la primera
        defensa contra ataques de CABALLO DE TROYA, que es luz que entra por el
        canal y recorre la cadena al reves.
      nota: >-
        QUE SEA PM ES LO QUE LO OBLIGA A IR ANTES DEL CODIFICADOR. Un aislador
        PM transmite un solo eje de polarizacion: puesto detras del codificador
        proyectaria los cuatro estados BB84 sobre la misma polarizacion y
        BORRARIA la codificacion entera. Ver CLAUDE.md 3.10.
    aislamiento:
      valor: 50.0
      unidad: dB
      estado: supuesto
      fuente: >-
        SUPUESTO. Valor tipico de un aislador de fibra de DOBLE ETAPA a
        1550 nm (una etapa da del orden de 25-30 dB y dos etapas en cascada
        suman); NO sale de ninguna ficha porque no hay producto elegido. Se
        declara porque es lo que dimensiona la proteccion del DFB y el margen
        frente a la luz de Troya, no para cerrar ningun presupuesto.
      falta: Aislamiento del aislador elegido, medido a 1550 nm
      pedir_a: Equipo de payload de ACSAR
    momento_dipolar_magnetico:
      valor: null
      unidad: A*m2
      estado: TBD
      falta: >-
        MOMENTO DIPOLAR MAGNETICO RESIDUAL DE LA PIEZA. Un aislador lleva un
        ROTADOR DE FARADAY con IMAN PERMANENTE: no es un componente pasivo
        desde el punto de vista magnetico. Ese iman lo ve el magnetometro del
        ADCS y suma al dipolo residual del satelite, que es lo que produce par
        perturbador contra el campo terrestre. Con dos aisladores (si el
        butterfly del laser lleva uno interno) se suman.
      pedir_a: Equipo de payload / Equipo de ADCS de ACSAR
    nota: >-
      SIN CANDIDATO: la envolvente que se dibuja es una reserva, no una pieza.
      VA JUSTO DETRAS DEL LASER, que es donde protege de verdad: cualquier
      retrorreflexion de los moduladores desestabiliza un DFB, y eso se
      traduce en salto de modo y en deriva de longitud de onda.
      COMPROBAR SI EL BUTTERFLY DEL G&H YA INTEGRA AISLADOR INTERNO: es
      frecuente en los modulos DFB de telecomunicaciones, y si lo lleva, esta
      pieza puede sobrar o quedarse en una sola etapa. Eso libera volumen en la
      bandeja y quita un iman permanente del satelite.
    masa:
