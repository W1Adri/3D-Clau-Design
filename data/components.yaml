          catalogo (90.17 por X, 95.89 por Y); los 90 grados alrededor de Z lo
          llevan a los ejes de 'dimensiones'. Sin ese giro el lado de 95.89 mm
          caeria por Y, que solo tiene 95.4 mm de altura interior, y saldria un
          desborde que no es real.
      dimensiones:
        valor: [95.89, 90.17, 5.51]
        unidad: mm
        estado: confirmado
        fuente: https://www.aac-clyde.space/wp-content/uploads/2021/10/AAC_DataSheet_Kryten.pdf
        nota: >-
          La ficha cubre la familia KRYTEN-M3; el sufijo PLUS anade GNSS.
          La altura 5.51 mm es "from top PCB to lowest component": NO es el paso
          de apilamiento PC104, que se trata aparte (ver pila_pc104).
          DISCREPANCIA con el STEP conectado, ver alternativas. Estas siguen
          siendo las cotas de FICHA y son las que usan los presupuestos y el
          chequeo de seccion; lo que se DIBUJA es el STEP.
        alternativas:
          - valor: [95.89, 90.17, 16.20]
            fuente: >-
              Medido sobre cad/vendor/aac_clyde_space/obc_3d_25_02929.step,
              excluidos los 104 pines del conector PC104 pasante.
            nota: >-
              Casi 11 mm mas de altura que la ficha. La ficha mide "from top PCB
              to lowest component" y el STEP incluye el cuerpo de los conectores.
          - valor: [95.89, 90.17, 23.24]
            fuente: >-
              Medido sobre el mismo STEP, envolvente completa.
            nota: >-
              Con los 104 pines del conector PC104, que bajan 12.45 mm por
              debajo de la tarjeta. En una pila PC104 esos pines atraviesan la
              tarjeta de abajo por diseno, asi que este solape es real y
              esperado, no una interferencia.
    part_number_verificado:
      valor: null
      estado: TBD
      falta: >-
        Confirmar que el STEP 3D-25-02929 RevJ es el Kryten-M3-PLUS. Hasta
        entonces la geometria dibujada es de referencia, no de ficha.
      pedir_a: Oscar (ACSAR) / AAC Clyde Space
    masa:
