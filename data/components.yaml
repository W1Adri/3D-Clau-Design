        estado: supuesto
        fuente: >-
          SUPUESTO. AAC no publica las cotas del Quasar-WSANT. 82 x 82 x 10 mm
          es el orden de magnitud de una antena de parche de banda S para
          cubesat, que a 2.2 GHz necesita del orden de 80 mm de lado con
          sustrato ceramico. NO es la ficha de este producto.
        falta: Dimensiones reales, ganancia, diagrama de radiacion y cara de montaje
        pedir_a: AAC Clyde Space
        nota: >-
          Los 10 mm de espesor PASAN de los 6.5 mm de protrusion que permite la
          CDS 14.1 req 2.2.3, asi que esta antena NO puede ir pegada por fuera:
          va por dentro, contra la pared -Z, radiando a traves de ella. Eso es
          una consecuencia de un numero supuesto; si el espesor real fuera
          menor de 6.5 mm, podria ir por fuera y liberar volumen interior.
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa
      pedir_a: AAC Clyde Space
    requiere_vista_exterior: true
    nota_vista: >-
      Debe apuntar a tierra. Compite por superficie con el telescopio y los
      paneles, y pierde: el telescopio ocupa el eje de +Z y el star tracker
      mira por la misma cara, y las caras +-X y +-Y no tienen hueco interior
      (la pila PC104 deja 2-3 mm contra la pared).
    nota: >-
      COLOCADA EN -Z, Y ESO TIENE UN COSTE QUE HAY QUE DECIDIR. Es el unico
      sitio con hueco: el extremo -Z de la columna de plataforma esta libre
      desde el final de las baterias. Pero -Z es la cara que entra primero en
      el dispensador y, sobre todo, apunta al lado CONTRARIO que el telescopio.
      Con el satelite apuntando +Z a la estacion optica durante un pase de QKD,
      esta antena mira al cenit. El canal clasico de post-procesado no tiene
      por que ser simultaneo al pase optico, asi que puede no ser un problema;
      pero es una decision de operaciones, no de mecanica, y esta sin tomar.

