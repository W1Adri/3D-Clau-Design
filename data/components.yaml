  - id: adcs_iadcs420
    id_drive: PLAT-04-ALT
    referencia_comercial: AAC Clyde Space iADCS4-20 (part number IADCS420-ASM-ST-1.0)
    nombre: AAC Clyde Space iADCS4-20 (alternativa, solo STEP)
    formato: pc104
    categoria: plataforma
    subsistema: ADCS
    cantidad: 1
    alternativa_de: adcs_iadcs400
    forma:
      tipo: step
      step:
        ruta: cad/vendor/aac_clyde_space/iadcs420.step
        estado: referencia
        fuente: >-
          Zip "Preliminar viability model" del equipo de ACSAR, recibido el
          2026-09-20. El STEP declara el producto
          'IADCS420-ASM-ST-1.0-defeatured-1.0_defeature'. Huella en
          cad/vendor/MANIFEST.yaml.
        orientacion: [90, 0, 0]
        nota: >-
          El STEP trae el eje de apilamiento por Y. Se gira 90 grados alrededor
          de X para llevarlo a Z, que es el eje de la pila en data/layout.yaml.
          El giro no cambia ninguna cota. El origen del STEP tampoco es el
          centro de la pieza, asi que se recentra.
      dimensiones:
        valor: [95.40, 93.90, 74.10]
        unidad: mm
        estado: referencia
        fuente: >-
          Medido sobre el propio STEP (210 solidos, caja envolvente calculada
          solido a solido), ya girado a los ejes del catalogo. AAC NO publica
          ficha del iADCS4-20: el STEP es la unica fuente que hay de este
          producto, y por eso el estado es 'referencia' y no 'confirmado'.
        nota: >-
          Frente al iADCS400 (95.4 x 95.9 x 67.3): el contorno transversal baja
          de 95.9 a 93.9 mm en Y y la altura de pila sube de 67.3 a 74.1 mm.
          Los 2 mm menos en Y IMPORTAN: el iADCS400 es el componente que fija el
          espesor de pared maximo en 2.30 mm (ver zona_util_interior). Si el
          satelite lleva el 4-20 y no el 400, esa cota pasa a
          (100.0 - 93.9) / 2 = 3.05 mm y la zona util crece. Mientras el 4-20
          sea una alternativa en estudio NO entra en ningun presupuesto ni
          chequeo, asi que la cota de trabajo sigue siendo la del 400.
          Los 6.8 mm mas de altura salen del otro lado: son 5 posiciones de
          separador PC104 igual (ceil(74.1 / 15.24) = 5), asi que la pila no
          cambia de longitud.
    modelo_confirmado:
      valor: null
      estado: TBD
      falta: >-
        Confirmar QUE ADCS lleva CLAU, iADCS400 o iADCS4-20, y por que el modelo
        preliminar trae el 4-20 cuando el brief cita el 400. Hasta saberlo hay
        dos componentes en el catalogo para un solo hueco de la pila.
      pedir_a: Oscar (ACSAR) / AAC Clyde Space
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa del iADCS4-20. No hay ficha publica de este producto.
      pedir_a: AAC Clyde Space
    requiere_vista_exterior: true
    nota_vista: Igual que el iADCS400, el star tracker necesita linea de vision libre.
    nota: >-
      NO esta colocado en data/layout.yaml y NO suma en masa, volumen ni
      potencia: 'alternativa_de' lo declara como candidato en estudio, no como
      pieza a bordo. Esta en el catalogo porque su geometria es un dato real y
      porque la alternativa hay que poder verla.

