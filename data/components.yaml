  - id: dicroico
    id_drive: OPT-09
    referencia_comercial: null
    nombre: Espejo dicroico (separacion beacon / canal cuantico)
    categoria: payload_optico
    subsistema: terminal_optico
    cantidad: 1
    montaje:
      cara: "-Y"
      eje: X
      tipo_eje: optico
      nota: >-
        El sustrato va a 45 grados dentro del soporte; lo que se declara aqui
        es el soporte, que es lo que ocupa. El eje X es el del canal cuantico,
        que lo ATRAVIESA; el beacon se refleja hacia +-Y.
    forma:
      tipo: caja
      dimensiones:
        valor: [23.0, 23.0, 23.0]
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Reserva cubica para el SOPORTE del dicroico, con el
          sustrato a 45 grados por dentro. La envolvente va alineada con los
          ejes porque lo que ocupa es la celda, no el sustrato. Un lado de
          23 mm admite un sustrato de unos 12-15 mm a 45 grados, que para un
          haz colimado de pocos milimetros sobra; si el haz sale mas gordo, el
          soporte crece. NO es ningun producto: no hay candidato elegido.
          ACOTADA POR ARRIBA POR EL BANCO, ademas: el FSM tiene que estar sobre
          el eje optico del telescopio, y entre ese eje y la pared +X de la
          columna de payload quedan unos 56 mm para el colimador y el dicroico
          juntos, gaps incluidos. Si las piezas reales son mayores no es que el
          modelo este mal: es que el banco no da, y habra que alargarlo a costa
          de la bandeja o de la longitud reservada al telescopio. El chequeo
          'banco_optico' recalcula ese margen desde el catalogo.
        falta: >-
          Diametro del haz colimado (del que sale el tamano del sustrato),
          longitudes de onda de corte y envolvente del soporte
        pedir_a: Equipo de optica de ACSAR
    nota: >-
