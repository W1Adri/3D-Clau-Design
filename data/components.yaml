          2026-09-20. El STEP declara '3D-25-02929 RevJ Assembly_defeature'.
          Huella en cad/vendor/MANIFEST.yaml.
        orientacion: [0, 0, 90]
        nota: >-
          REFERENCIA, no confirmado: el part number 3D-25-02929 NO esta
          verificado como Kryten-M3-PLUS. Es una tarjeta PC104 de AAC del
          tamano correcto, y el equipo la llamo "Onboard_computer", pero eso no
