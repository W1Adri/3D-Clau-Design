        Decision de arquitectura de ACSAR del 2026-09-20. Son cuatro puertos
        fisicos: el brazo (-Y), la camara (+Y), el laser (-X) y el opuesto al
        laser (+X). El tramo -Y lo comparten el beacon de subida que ENTRA y el
        de bajada que SALE: es el mismo tramo fisico recorrido en los dos
        sentidos y con dos colores, y por eso en data/connections.yaml e08
        declara 'keep_out_compartido_con: e04' en vez de duplicar el volumen.
    nota: >-
      Dentro del brazo que refleja D1. SIN CANDIDATO: lo que se dibuja es una
