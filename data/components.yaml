        paredes. Un tercer modulador pide una banda entera: 25 mm mas otros
        8 mm de hueco, o sea 33 mm, y solo quedan 9.4. FALTAN 23.6 mm.
        En X tampoco: la franja tiene 26.3 mm y la X del codificador NO ES
        LIBRE -- tiene que quedar coaxial con el colimador --, asi que a su
        lado quedan 14.6 mm, que dan para un modulador pero no para dos. Y en Z
        menos aun: cada uno pide 130 mm de recorrido recto de los 200 que hay,
        y de esos 200 el tramo post-codificacion ya se lleva 218 (no cabe: ver
        el chequeo 'fibra_post_codificacion').
