      del GNSS. Va en la pila de plataforma, no en la columna de payload: es la
      tarjeta que mas habla con el OBC (bus de datos y PPS del GNSS del
      Kryten-M3-PLUS), y en la columna de payload no hay formato PC104 ni sitio
      entre el banco y la bandeja.
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa de la tarjeta poblada
      pedir_a: Equipo de electronica de ACSAR

