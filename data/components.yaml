  - id: telescopio_cassegrain
    id_drive: OPT-13
    referencia_comercial: Aperture Optical Sciences, Cassegrain a medida, apertura 90 mm
    nombre: Telescopio Cassegrain on-axis, apertura 90 mm
    categoria: payload_optico
    subsistema: terminal_optico
    cantidad: 1
    montaje:
      cara: "-Z"
      eje: Z
      tipo_eje: optico
      nota: >-
        Eje optico segun Z, apuntando a +Z. Se monta por su brida trasera
        (-Z local), que es por donde le entra el haz desde el FSM.
    forma:
      tipo: cassegrain
      step_esperado:
        ruta: cad/vendor/aperture_optical_sciences/telescopio_cassegrain.step
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
        fuente_prevista: >-
          Telescopio Cassegrain de Aperture Optical Sciences, via Oscar (ACSAR).
          Existe ya un concepto en Telescopio_concepto.SLDPRT (entrega
          "Preliminar viability model" del 2026-09-20), que hay que reexportar
          a STEP AP214 o AP242 porque el formato nativo de SolidWorks no hay
          manera de leerlo.
        nota: >-
          En cuanto el fichero este en esa ruta, sustituye al modelo
          parametrico de src/clau3d/optica/ sin tocar nada mas. El modelo
          parametrico es el FALLBACK, no un competidor del STEP. Entrara como
          'referencia' hasta verificar que es el barrilete definitivo y no el
          concepto.
      dimensiones:
        valor: [95.4, 95.4, 200.0]
        unidad: mm
        estado: supuesto
        fuente: >-
          COTA SUPERIOR, no una medida. Es la ENVOLVENTE que el telescopio
          reserva, y lo que usan el analisis de volumen y el de interferencias:
          el modelo detallado es hueco por dentro, y meter ese hueco en el
          analisis diria que dentro del tubo cabe algo, que es falso. El lado
          de la seccion es la altura interior del 6U (95.4 mm): el barrilete no
          puede pasar de ahi, luego este es el telescopio MAS GRANDE que cabe,
          no el que hay. Es una seccion CUADRADA, no un diametro: ver
          'optica.seccion_barrilete', que es donde esta el razonamiento. La
          longitud es la ya reservada en el layout ('longitud_reservada',
          200 mm, provisional). Con 90 mm de apertura libre quedan 2.7 mm hasta
          la cara plana y 22.5 mm hasta la esquina; ver el chequeo
          'apertura_telescopio'. Si no cabe, el telescopio tendra que ser el
          propio elemento estructural de esa cara.
        falta: >-
          Diametro exterior del barrilete y longitud optica real. YA EXISTE un
          concepto en formato nativo SolidWorks (Telescopio_concepto.SLDPRT,
          entrega "Preliminar viability model" del 2026-09-20), ilegible. Hace
          falta reexportarlo a STEP AP214 o AP242 y dejarlo en la ruta de
          'step_esperado'. Ver cad/vendor/MANIFEST.yaml, seccion
          'sin_convertir'.
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
        nota: >-
          El brief indica "aprox. 2U" y apertura libre 90 mm, pero 2U no fija el
          contorno. El contorno exterior es el numero critico: ver el chequeo
          'apertura_telescopio' en el analisis. OJO con el "2U": la U de longitud
          de la CDS son 113.5 mm, no 100, asi que "2U" son ~227 mm. La longitud
          real saldra del STEP del telescopio (Oscar), no de esta cifra.
    longitud_reservada:
      valor: 200.0
      unidad: mm
      estado: decision
      fuente: >-
        Decision de reparto ACSAR del 2026-09-20, al pasar los moduladores a la
        franja lateral. Es el hueco que se le RESERVA al telescopio en Z dentro
        de la columna de payload, no una longitud medida.
      nota: >-
        PROVISIONAL. Valor de trabajo mientras no llegue el STEP. No confundir
        con los "~2U" del brief: con la U de longitud de la CDS (113.5 mm) esos
        2U son 227 mm, no 200. La distribucion admite hasta 306.4 mm vaciando la
        bandeja; con 200 mm quedan 106.4 mm de bandeja y con 227 mm quedan
        79.4 mm. Cambiar este valor y regenerar el layout es todo lo que hace
        falta para reasignar el reparto.
    apertura_libre:
      valor: 90.0
      unidad: mm
      estado: decision
      fuente: Decision de diseno ACSAR (arquitectura opcion B, 19-09-2026)
      nota: Tipo empleado en QUBE-II. Fabricacion a medida.
    # -----------------------------------------------------------------
    # Configuracion optica y mecanica del barrilete.
    #
    # De aqui sale TODO lo que dibuja src/clau3d/optica/. Nada de esto es un
    # dato de Aperture Optical Sciences: es la aproximacion de este
    # repositorio, y por eso casi todo esta como 'supuesto'. Que el modelo sea
    # detallado no lo sube de estado -- se sigue dibujando en gris y
    # transparente, sigue sin sumar en los presupuestos y sigue entero en
    # reports/06_pendientes.md.
    #
    # Lo que NO esta aqui es lo que se DERIVA de esto: la magnificacion, la
    # focal del secundario, la separacion entre vertices, la obstruccion
    # lineal, la perdida por obstruccion y los diametros del secundario y del
    # agujero. Se calculan en src/clau3d/optica/parametros.py. Escribirlos
    # tambien aqui seria la manera segura de que las dos copias dejaran de
    # coincidir.
    optica:
      configuracion:
        valor: afocal_mersenne
        estado: decision
        fuente: >-
          DECISION DE ARQUITECTURA de este modelo, no de ACSAR todavia. Afocal
          tipo Mersenne: primario parabolico concavo y secundario parabolico
          convexo, confocales, de manera que el telescopio entra colimado y
          sale colimado y es un puro compresor de haz. El motivo es el banco
          optico. Un Cassegrain FOCAL clasico (f/12, EFL 1080 mm) pone el foco
          real a unos 40 mm por detras del vertice del primario, o sea DENTRO
          de z_payload_banco, y obliga a meter una lente de enfoque en un banco
          que solo tiene 7.7 mm de margen en la linea que importa (ver 3.7 de
          CLAUDE.md). El afocal no necesita ningun elemento adicional: cero
          superficies transmisivas en el camino del canal cuantico, donde
          cualquier refractivo mete birrefringencia por tension y se come la
          pureza de polarizacion, que es justamente lo que el enlace mide.
        nota: >-
          Si esto pasara a 'focal_clasico', el modelo dibuja el foco real a
          'distancia_focal_trasera' detras del vertice del primario y el
          chequeo 'configuracion_telescopio' avisa de que cae dentro del banco.
        alternativas:
          - valor: focal_clasico
            fuente: Arquitectura de partida del brief (Cassegrain f/12, EFL 1080 mm)
            nota: >-
              Descartada en este modelo por lo de arriba. Tiene a favor que es
              la configuracion de catalogo de un Cassegrain comercial; tiene en
              contra el foco dentro del banco y la lente de enfoque.
      focal_primario:
        valor: 200.0
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO, y ACOTADO POR ARRIBA por la longitud reservada. Con 90 mm
          de apertura sale f/2.22, que es rapido pero es lo que permite la
          caja: la separacion entre vertices de un Mersenne es
          f1 * (1 - 1/M), asi que la focal del primario y la longitud del
          barrilete son el mismo numero con otro nombre. Con
          'longitud_reservada' = 200 mm y los espesores de aqui abajo, 200 mm
          de focal dejan 1.2 mm de margen: ver el chequeo
          'longitud_telescopio'. No es una eleccion optica, es el techo.
        falta: Focal real del primario, del diseno optico de Aperture Optical Sciences
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
        nota: >-
          Un primario a f/2.22 es exigente de fabricar y de alinear, y es
          consecuencia directa de meter 90 mm de apertura en 2U. Con los ~2U de
          verdad del brief (227 mm, no 200) la misma optica tendria unos 28 mm
          de margen en vez de 1.2.
      conica_primario:
        valor: -1.0
        estado: supuesto
        fuente: >-
          SUPUESTO impuesto por la configuracion: un afocal confocal solo es
          afocal si las dos superficies son parabolas (K = -1). No es una
          eleccion libre mientras 'configuracion' sea afocal_mersenne.
        falta: Constante conica real del primario del diseno optico
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      conica_secundario:
        valor: -1.0
        estado: supuesto
        fuente: >-
          SUPUESTO, por lo mismo que el primario: en el Mersenne las dos
          conicas son parabolas confocales.
        falta: Constante conica real del secundario del diseno optico
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      diametro_haz_comprimido:
        valor: null
        unidad: mm
        estado: TBD
        falta: >-
          Diametro del haz colimado a la salida del telescopio, que es el mismo
          que entra por la brida trasera desde el FSM. ES EL PARAMETRO QUE LO
          ACOPLA TODO: fija la magnificacion (M = apertura_libre / este
          diametro), y con ella la focal del secundario, la separacion entre
          vertices y el diametro del secundario; y decide si el FSM elegido
          vale, porque un haz de d mm sobre un espejo a 45 grados deja una
          huella de d x d*raiz(2). Es el mismo hueco que 'diametro_haz_mm' en
          e01..e05 de data/connections.yaml.
        pedir_a: Equipo de optica de ACSAR
        nota: >-
          Mientras falte, el modelo dibuja con
          'integracion.optica.diametro_haz_modelado' (10 mm, SUPUESTO), que es
          el mismo numero con el que se dibujan los keep-outs de haz libre del
          banco. Se lee de alli y no se copia aqui a proposito: el haz que sale
          del FSM y el que entra por la brida son el mismo haz. Ver el chequeo
          'haz_vs_fsm'.
      distancia_focal_trasera:
        valor: 40.0
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Solo se usa si 'configuracion' pasa a 'focal_clasico': es
          donde caeria el foco real, por detras del vertice del primario. El
          orden de magnitud es el tipico de un Cassegrain de catalogo y es
          suficiente para lo unico que hace falta saber, que es que ese foco
          cae dentro de z_payload_banco. En el afocal no se usa para nada.
        falta: Distancia focal trasera del diseno focal, si se eligiera esa configuracion
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      margen_secundario:
        valor: 1.4
        estado: supuesto
        fuente: >-
          SUPUESTO. Factor por el que el secundario es mayor que el haz que
          intercepta, para cubrir el campo y los errores de alineacion y
          despace. Un 40 por ciento es lo habitual en un terminal de campo
          pequeno; el numero real sale del diseno optico con el campo de vista
          y el presupuesto de alineacion, que no existen todavia.
        falta: Sobredimensionado real del secundario (campo de vista y alineacion)
        pedir_a: Equipo de optica de ACSAR
      margen_agujero_primario:
        valor: 4.0
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. El agujero central del primario es el diametro del
          secundario mas este margen, para que el haz comprimido pase sin
          vinetear con la tolerancia de mecanizado y de alineacion.
        falta: Diametro real del agujero central del primario
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      margen_substrato_primario:
        valor: 1.0
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO, y ACOTADO POR ARRIBA por el barrilete: el sustrato del
          primario es la apertura libre mas este margen por lado, y tiene que
          caber en el hueco cuadrado que dejan las paredes, que son
          95.4 - 2*espesor_pared_barrilete = 92.4 mm entre caras. Con 1.0 mm
          quedan 92.0 mm de sustrato y 0.4 mm de holgura de montaje. No hay
          mas: es el mismo apreton de 4.2 de CLAUDE.md, visto desde dentro.
        falta: Diametro exterior real del sustrato del primario
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      estabilidad_despace_primario_secundario:
        valor: null
        unidad: um
        estado: TBD
        falta: >-
          Estabilidad exigida a la separacion entre el vertice del primario y
          el del secundario a lo largo de la orbita, en micras. La sensibilidad
          a desenfoque de un Cassegrain escala con m^2 (1+m), o sea con el
          cuadrado de la magnificacion del secundario, asi que unas pocas
          micras de deriva termica entre los dos espejos se comen el
          presupuesto de frente de onda entero. ES EL REQUISITO QUE DIMENSIONA
          el tubo metrico (material, seccion, si hace falta invar o CFRP) y la
          arana, y hoy no existe: el barrilete y los vanes de este modelo estan
          dibujados con espesores supuestos, no con una rigidez calculada.
        pedir_a: Equipo de optica de ACSAR
      seccion_barrilete:
        valor: [95.4, 95.4]
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO, y CUADRADA a proposito. Es la altura interior del 6U, o sea
          la cota superior de 4.2 de CLAUDE.md, pero ahora como LADO de un
          cuadrado y no como diametro. La diferencia es todo el argumento: con
          un barrilete de revolucion de 95.4 mm de diametro y 90 mm de apertura
          quedan 2.7 mm por lado, que no dan ni para la celda del espejo, ni
          para los flexures, ni para tornilleria. Con seccion cuadrada de
          95.4 mm la semidiagonal son 67.5 mm, asi que en las ESQUINAS quedan
          22.5 mm radiales, que es donde cabe todo eso. Ademas es lo unico
          compatible con la salida que ya apunta 4.2: si el telescopio tiene
          que ser el elemento estructural de esa cara, hacen falta caras planas
          y bridas, no un tubo redondo.
        falta: Contorno exterior real del barrilete
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
        nota: >-
          Tiene que coincidir con las dos primeras cotas de 'forma.dimensiones':
          lo que se reserva se mide sobre lo que se dibuja, y el modelo falla al
          cargar si dejan de coincidir.
      espesor_pared_barrilete:
        valor: 1.5
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO, y ACOTADO POR ARRIBA: entre la apertura libre y la cara
          plana del barrilete hay (95.4 - 90)/2 = 2.70 mm, y ahi tienen que
          caber la pared, el baffle y su holgura. Con 1.5 mm de pared quedan
          1.2 mm para holgura (0.5) y baffle (0.6), y 0.1 mm de aire. La carga
          no la llevan estas paredes: la llevan los largueros de esquina, que
          es donde hay seccion.
        falta: Espesor y material reales de la pared del barrilete
        pedir_a: Equipo de estructura de ACSAR / Aperture Optical Sciences
      espesor_mamparo:
        valor: 3.0
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO, y ACOTADO POR ARRIBA por la longitud reservada: los dos
          mamparos, la celda y los dos espejos tienen que caber en lo que sobra
          despues de la separacion entre vertices, que son 200 - 177.8 = 22.2 mm.
          3 mm por mamparo es el minimo razonable para una placa que lleva la
          brida de interfaz y la apertura.
        falta: Espesor real de los mamparos
        pedir_a: Equipo de estructura de ACSAR / Aperture Optical Sciences
      lado_larguero_esquina:
        valor: 12.0
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Lado de los cuatro largueros de esquina que unen los dos
          mamparos. Son el camino de carga real del barrilete, porque en la
          cara plana no queda seccion (1.5 mm de pared) y en la esquina hay
          22.5 mm radiales. El numero real sale del analisis de rigidez, que
          depende de 'estabilidad_despace_primario_secundario', que es TBD.
        falta: Seccion real de los largueros, del analisis de rigidez del tubo
        pedir_a: Equipo de estructura de ACSAR
      brida_interfaz_fsm:
        valor: [40.0, 40.0]
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Resalte cuadrado sobre la cara interior del mamparo trasero
          por el que el telescopio se atornilla al banco optico y por cuyo
          agujero central le entra el haz desde el FSM. Va HACIA DENTRO y no
          hacia fuera a proposito: hacia fuera invadiria el hueco que el layout
          le da al banco (z_payload_banco), y la envolvente declarada dejaria
          de ser la que se dibuja.
        falta: Interfaz mecanica real telescopio-banco (patron de taladros y plano de referencia)
        pedir_a: Oscar (ACSAR) / Equipo de optica de ACSAR
      espesor_brida:
        valor: 3.0
        unidad: mm
        estado: supuesto
        fuente: SUPUESTO. Altura del resalte de interfaz sobre el mamparo trasero.
        falta: Espesor real de la brida de interfaz
        pedir_a: Oscar (ACSAR) / Equipo de optica de ACSAR
      margen_agujero_entrada:
        valor: 2.0
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. El agujero de entrada del mamparo trasero es el diametro
          del haz comprimido mas este margen por lado, para no vinetear con la
          tolerancia de montaje del telescopio sobre el banco.
        falta: Diametro real del agujero de entrada
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      espesor_espejo_primario:
        valor: 8.0
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO, y ACOTADO POR ARRIBA por la longitud reservada (ver
          'espesor_mamparo'). 8 mm en el vertice para un sustrato de 92 mm es
          una relacion de aspecto de 11.5, que es fina: un espejo asi
          necesitaria aligeramiento y una celda muy cuidada. Que salga tan fino
          no es una eleccion, es lo que deja la caja.
        falta: Espesor y material reales del sustrato del primario
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      espesor_espejo_secundario:
        valor: 4.0
        unidad: mm
        estado: supuesto
        fuente: SUPUESTO. Espesor del sustrato del secundario, acotado por la misma pila en Z.
        falta: Espesor y material reales del sustrato del secundario
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      altura_celda:
        valor: 3.0
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO, y ACOTADO POR ARRIBA por la misma pila en Z. Es la altura
          de los flexures entre el mamparo trasero y la espalda del primario.
          3 mm es poquisimo para un flexure de verdad, y eso es exactamente lo
          que dice el chequeo 'longitud_telescopio': con 200 mm reservados no
          hay sitio para una celda como Dios manda.
        falta: Altura real de la celda isostatica del primario
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      flexures:
        valor: 3
        estado: supuesto
        fuente: >-
          SUPUESTO. Tres puntos es lo que hace isostatica una montura: tres
          puntos definen un plano y no meten esfuerzos en el sustrato al
          dilatar. Cuatro sobrerrestringen y deforman el espejo con la
          temperatura.
        falta: Numero y tipo reales de flexures de la celda
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      radio_circulo_flexures:
        valor: 40.0
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Radio del circulo de apoyo de la celda, por detras del
          sustrato del primario. Se elige el mayor que deja los tres flexures
          dentro del hueco del barrilete y sin tocar los largueros de esquina.
        falta: Radio real del circulo de apoyo de la celda
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      angulo_primer_flexure:
        valor: 45.0
        unidad: deg
        estado: supuesto
        fuente: >-
          SUPUESTO, y es una decision, no un numero cualquiera: los tres
          flexures van a 120 grados entre si, y el primero se pone a 45 para
          que caiga en una ESQUINA del barrilete, que es donde hay radio
          (22.5 mm frente a 2.7 mm en la cara plana). Es el argumento de la
          seccion cuadrada aplicado a la celda.
        falta: Orientacion real de la celda respecto al barrilete
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      seccion_flexure:
        valor: [6.0, 6.0]
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Seccion del bloque de cada flexure. La de verdad sale del
          analisis de rigidez, que depende de
          'estabilidad_despace_primario_secundario', que es TBD.
        falta: Seccion real de los flexures
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      margen_buje_secundario:
        valor: 3.0
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Anillo de material alrededor del secundario por el que la
          arana lo sujeta y por el que pasan los tornillos de colimacion.
        falta: Montura real del secundario
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      tornillos_colimacion:
        valor: 3
        estado: supuesto
        fuente: >-
          SUPUESTO. Tres tornillos es lo minimo para colimar un secundario en
          tip, tilt y despace, y es lo habitual.
        falta: Mecanismo real de colimacion del secundario
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      diametro_tornillo_colimacion:
        valor: 3.0
        unidad: mm
        estado: supuesto
        fuente: SUPUESTO. Un M3 es lo tipico en una montura de este tamano.
        falta: Tornilleria real de colimacion
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      vanes:
        valor: 4
        estado: supuesto
        fuente: >-
          SUPUESTO. Cuatro vanes en cruz es la arana clasica. Se descarta a
          proposito la alternativa de sujetar el secundario con una PLACA
          CORRECTORA, que lo sostendria sin vanes y sin difraccion: es un
          elemento refractivo en el camino del canal cuantico, y cualquier
          refractivo mete birrefringencia por tension que estropea la pureza de
          polarizacion, que es justo lo que el enlace mide.
        falta: Numero real de vanes de la arana
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      espesor_vane:
        valor: 0.8
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Un vane fino reduce el area obstruida y los picos de
          difraccion, pero tiene que aguantar la rigidez que exige
          'estabilidad_despace_primario_secundario', que es TBD. 0.8 mm es un
          valor tipico; el real sale de ese requisito.
        falta: Espesor real de los vanes
        pedir_a: Equipo de estructura de ACSAR / Aperture Optical Sciences
      ancho_vane:
        valor: 6.0
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Extension de cada vane a lo largo del eje optico. Acotada
          por arriba por el mamparo frontal: con la separacion derivada, la
          arana tiene 6 mm entre el secundario y la apertura.
        falta: Geometria real de la arana
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
      holgura_baffle:
        valor: 0.5
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO, y ACOTADO POR ARRIBA por lo mismo que la pared: entre la
          apertura y la cara plana hay 2.70 mm para pared + holgura + baffle.
          Ojo con lo que significa este numero: es lo que los diafragmas
          knife-edge pueden proyectar hacia dentro sin vinetear el haz. Medio
          milimetro de cuchilla es lo que da de si un 6U con 90 mm de apertura.
        falta: Holgura real entre el haz y el baffle, del analisis de luz parasita
        pedir_a: Equipo de optica de ACSAR
      espesor_baffle:
        valor: 0.6
        unidad: mm
        estado: supuesto
        fuente: SUPUESTO. Pared de chapa fina de los baffles, acotada por lo mismo.
        falta: Espesor real de los baffles
        pedir_a: Equipo de optica de ACSAR
      diafragmas_internos:
        valor: 4
        estado: supuesto
        fuente: >-
          SUPUESTO. Numero de anillos knife-edge repartidos a lo largo del
          baffle principal. Cuatro es lo habitual en un tubo de este tamano; el
          numero y la posicion reales salen de un trazado de luz parasita que
          no existe.
        falta: Numero y posicion reales de los diafragmas, del analisis de luz parasita
        pedir_a: Equipo de optica de ACSAR
      espesor_diafragma:
        valor: 1.0
        unidad: mm
        estado: supuesto
        fuente: SUPUESTO. Espesor de cada anillo knife-edge.
        falta: Espesor real de los diafragmas
        pedir_a: Equipo de optica de ACSAR
      angulo_exclusion_solar:
        valor: null
        unidad: deg
        estado: TBD
        falta: >-
          Angulo de exclusion solar del terminal: a que separacion angular del
          Sol tiene que seguir funcionando el enlace. Es lo que DIMENSIONA el
          baffle del primario y el del secundario, y con ellos la obstruccion
          y el presupuesto de luz parasita. Sin el, los dos baffles de este
          modelo estan dibujados con un angulo supuesto.
        pedir_a: Equipo de optica de ACSAR
      angulo_exclusion_solar_modelado:
        valor: 30.0
        unidad: deg
        estado: supuesto
        fuente: >-
          SUPUESTO. Valor de trabajo para poder dibujar los baffles del
          primario y del secundario, en el rango de lo que se suele exigir a un
          terminal optico de LEO. La longitud de cada baffle se saca de una
          regla de primer orden, r / tan(angulo), que NO es un analisis de luz
          parasita: dice cuanto tiene que medir un tubo de radio r para que el
          agujero deje de verse desde fuera por encima de ese angulo. El numero
          bueno sale de un trazado de rayos con el angulo real.
        falta: El angulo de verdad, que es 'angulo_exclusion_solar'
        pedir_a: Equipo de optica de ACSAR
    longitud_optica:
      valor: null
      unidad: mm
      estado: TBD
      falta: Longitud del tubo. Interesa distancia focal larga; se admite acortar.
      pedir_a: Aperture Optical Sciences
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa
      pedir_a: Aperture Optical Sciences
    requiere_vista_exterior: true
    nota_vista: La apertura necesita vision despejada hacia el exterior (keep-out del haz).

  - id: fsm
    id_drive: OPT-10
    referencia_comercial: Mirrorcle Technologies, MEMS de dos ejes en encapsulado DIP24
    nombre: Espejo de apuntado fino (FSM) - opcion MEMS
    categoria: payload_optico
    subsistema: terminal_optico
    cantidad: 1
    montaje:
      cara: "-Z"
      eje: Z
      tipo_eje: optico
      nota: >-
        El espejo mira por +Z local. En el banco va girado para doblar el haz
        que llega segun X hacia el telescopio, que apunta segun +Z.
    forma:
      tipo: caja
      dimensiones:
        valor: [30.5, 15.1, 2.16]
        unidad: mm
        estado: referencia
        fuente: https://mirrorcletech.com/pdf/Mirrorcle_MEMS_Packages_and_Mounts_Guide.pdf
        nota: >-
          Encapsulado DIP24 ceramico de Mirrorcle: "Ceramic Dimensions:
          30.5 mm x 15.1 mm, Ceramic Thickness: 2.16 mm". Es una cota publicada
          de un encapsulado real de la familia candidata, no del producto
          elegido, y NO INCLUYE EL SOPORTE, que es lo que de verdad ocupa: el
          mount de Mirrorcle para banco optico es una PCB de 66.04 x 25.40 mm
          con un zocalo ZIF de ~12.5 mm de alto. Un montaje a medida para vuelo
          sera otra cosa, pero no menos que el encapsulado.
        alternativas:
          - valor: [66.04, 25.4, 14.07]
            fuente: https://mirrorcletech.com/pdf/Mirrorcle_MEMS_Packages_and_Mounts_Guide.pdf
            nota: >-
              MOUNT-DIP.5-KMS: "PCB Dimensions: 66.04mm x 25.40mm x 1.57mm,
              ZIF Socket Height: ~12.5mm". Es el soporte de laboratorio, no de
              vuelo, pero da el orden de magnitud de lo que hay que reservar de
              verdad alrededor del encapsulado.
    diametro_espejo:
      valor: 5.0
      unidad: mm
      estado: referencia
      fuente: >-
        Diametro de espejo de la familia MEMS de Mirrorcle que se viene citando
        para CLAU por herencia de CLICK-A (ver 'eleccion_de_tecnologia'). Es una
        cota de un producto real de la familia candidata, NO del producto
        elegido, y no esta verificada contra la ficha del modelo concreto.
      nota: >-
        DATO DECISIVO Y PEQUENO. Un haz de d mm que incide a 45 grados deja una
        huella de d x d*raiz(2) sobre el espejo, asi que un espejo circular de
        D mm solo admite un haz de D*cos(45) = D/raiz(2). Con 5 mm eso son
        3.54 mm, y con la apertura de 90 mm obliga a una magnificacion de al
        menos 25.5. Si el equipo de optica pide un haz mayor, este MEMS NO vale
        y hay que ir al 'fsm_piezo_pi_s331' o subir la magnificacion. Ver el
        chequeo 'haz_vs_fsm'.
    eleccion_de_tecnologia:
      valor: null
      estado: TBD
      falta: >-
        Elegir entre MEMS (Mirrorcle, herencia CLICK-A, espejo de 5 mm) y piezo
        (PI S-331). Se modela el MEMS porque es el que tiene cota publicada
        clara; eso NO es la eleccion. La alternativa piezo esta en el catalogo
        como 'fsm_piezo_pi_s331'.
      pedir_a: Equipo de optica de ACSAR
    soporte:
      valor: null
      estado: TBD
      falta: >-
        Soporte de vuelo del MEMS: el encapsulado DIP24 no se atornilla solo a
        un banco optico. Es lo que decide el volumen real de esta pieza.
      pedir_a: Equipo de optica de ACSAR
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa del MEMS con su soporte de vuelo
      pedir_a: Mirrorcle Technologies / Equipo de optica de ACSAR
    nota: >-
      Se modela la opcion MEMS porque es la que tiene cotas publicadas claras,
      no porque este elegida. La opcion piezo esta a su lado como
      'fsm_piezo_pi_s331', con las cifras que SI publica PI.

  - id: fsm_piezo_pi_s331
    id_drive: OPT-10-ALT
    referencia_comercial: Physik Instrumente S-331.2SB (plataforma piezo tip/tilt)
    nombre: FSM - alternativa piezo PI S-331 (no va a bordo, esta en estudio)
    categoria: payload_optico
    subsistema: terminal_optico
    cantidad: 1
    alternativa_de: fsm
    montaje:
      cara: "-Z"
      eje: Z
      tipo_eje: optico
    forma:
      tipo: cilindro
      eje: Z
      dimensiones:
        valor: [50.0, 50.0, 22.0]
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. PI publica la masa del S-331 y sus datos mecanicos, pero
          sus cotas exteriores estan solo en el plano del manual (figura, sin
          texto extraible). Las de aqui son una reserva del orden correcto para
          una plataforma tip/tilt de flexion que monta un espejo de 12.7 mm.
          Lo que SI es dato y esta abajo es la masa, 130 g, que es el numero
          decisivo: es 2 ordenes de magnitud mas que un MEMS.
        falta: Cotas exteriores del S-331 (plano acotado o STEP)
        pedir_a: Physik Instrumente
    masa:
      valor: 130.0
      unidad: g
      estado: confirmado
      fuente: >-
        PI, manual S-331 PZ256E (7/29/2026), tabla "Mechanical properties":
        "Overall mass ... 130 g" para S-331.2SB / .2SH / .2SL.
      nota: >-
        DATO DECISIVO. La variante de 5 mrad (S-331.5Sx) pesa 280 g. Frente a
        un MEMS de gramos, 130 g en el banco optico cambian el presupuesto de
        masa y el momento de inercia. Es el argumento fuerte a favor del MEMS.
      alternativas:
        - valor: 280.0
          fuente: PI, manual S-331 PZ256E, misma tabla, columna S-331.5SH / .5SL
          nota: Variante de 5 mrad de recorrido. Mas del doble de masa.
    recorrido_angular:
      valor: 3.0
      unidad: mrad
      estado: confirmado
      fuente: 'PI, manual S-331 PZ256E: S-331.2Sx, 3 mrad de tip/tilt.'
    temperatura_operacion:
      valor: [-20.0, 80.0]
      unidad: C
      estado: confirmado
      fuente: 'PI, manual S-331 PZ256E, tabla "Miscellaneous".'
    espejo_admitido:
      valor: [12.7, 3.0]
      unidad: mm
      estado: confirmado
      fuente: >-
        PI, manual S-331 PZ256E: ejemplo de centrado para espejo de diametro
        12.7 mm (0.5") y 3 mm de espesor.
      nota: Diametro y espesor del espejo de referencia. Fija el tamano del haz.
    nota: >-
      NO esta colocado en data/layout.yaml y NO suma en ningun presupuesto:
      'alternativa_de' lo declara como candidato en estudio, no como pieza a
      bordo. Esta aqui porque su masa SI es un dato, y es el dato que decide.

  - id: dicroico_d1
    id_drive: OPT-09
    referencia_comercial: null
    nombre: Dicroico D1 (separacion canal cuantico / beacons)
    categoria: payload_optico
    subsistema: terminal_optico
    cantidad: 1
    montaje:
      cara: "-Y"
      eje: X
      tipo_eje: optico
      nota: >-
        El sustrato va a 45 grados dentro del soporte; lo que se declara aqui
        es el soporte, que es lo que ocupa. El eje X es el del canal cuantico,
        que lo ATRAVIESA; los DOS beacons se reflejan hacia un unico brazo
        lateral segun +Y.
    forma:
      tipo: caja
      dimensiones:
        valor: [23.0, 23.0, 23.0]
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Reserva cubica para el SOPORTE de D1, con el
          sustrato a 45 grados por dentro. La envolvente va alineada con los
          ejes porque lo que ocupa es la celda, no el sustrato. Un lado de
          23 mm admite un sustrato de unos 12-15 mm a 45 grados, que para un
          haz colimado de pocos milimetros sobra; si el haz sale mas gordo, el
          soporte crece. NO es ningun producto: no hay candidato elegido.
          ACOTADA POR ARRIBA POR EL BANCO, ademas: el FSM tiene que estar sobre
          el eje optico del telescopio, y entre ese eje y la pared +X de la
          columna de payload quedan unos 56 mm para el colimador y D1
          juntos, gaps incluidos. Si las piezas reales son mayores no es que el
          modelo este mal: es que el banco no da, y habra que alargarlo a costa
          de la bandeja o de la longitud reservada al telescopio. El chequeo
          'banco_optico' recalcula ese margen desde el catalogo.
        falta: >-
          Diametro del haz colimado (del que sale el tamano del sustrato),
          longitudes de onda de corte y envolvente del soporte
        pedir_a: Equipo de optica de ACSAR
    tipo_filtro:
      valor: paso_largo
      estado: decision
      fuente: >-
        Decision de arquitectura de ACSAR del 2026-09-20. Paso largo con el
        borde en 'integracion.optica.borde_dicroico_d1': transmite el 1550 del
        canal cuantico y refleja los dos beacons (976 de subida y 1064 de
        bajada) hacia un unico brazo lateral, donde D2 los separa. La
        alternativa -- un brazo por beacon, con la camara y el laser en lados
        opuestos de D1 -- es la que habia antes y NO FUNCIONA: un laser que
        emite contra la cara trasera de D1 no tiene camino hacia el FSM.
    puertos:
      valor:
        - "+X (transmision): canal cuantico 1550 nm hacia el FSM (e03)"
        - "-X (transmision): entrada del canal cuantico, que llega del espejo de plegado (e02)"
        - "+Y (reflexion): brazo compartido de los dos beacons, hacia D2 (e06/e09)"
        - "-Y (reflexion): fuga del 1550 en reflexion -> trampa_luz_d1 (e10)"
      estado: decision
      fuente: >-
        Decision de arquitectura de ACSAR del 2026-09-20. Se declara aqui para
        que ningun puerto quede sin destino: el cuarto puerto de un divisor no
        desaparece porque no se dibuje, y sin trampa la fuga del 1550 en
        reflexion se queda rebotando dentro del banco. Hay un test que
        comprueba que los cuatro tienen conexion declarada en
        data/connections.yaml.
    nota: >-
      El canal cuantico lo atraviesa; los DOS beacons se reflejan hacia el
      mismo brazo lateral, y dentro de ese brazo los separa 'dicroico_d2'.
      SIN CANDIDATO: lo que se dibuja es una reserva, no una pieza.
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa del divisor y su soporte
      pedir_a: Equipo de optica de ACSAR

  - id: dicroico_d2
    id_drive: OPT-15
    referencia_comercial: null
    nombre: Dicroico D2 (separacion beacon de subida / beacon de bajada)
    categoria: payload_optico
    subsistema: terminal_optico
    cantidad: 1
    montaje:
      cara: "-Y"
      eje: Y
      tipo_eje: optico
      nota: >-
        Va dentro del brazo que refleja D1, asi que su eje en linea es Y: por
        el le llega el beacon de subida desde D1 y por el sigue hasta la
        camara. El de bajada entra LATERALMENTE segun X y sale reflejado hacia
        -Y, de vuelta a D1. El sustrato va a 45 grados dentro del soporte,
        igual que en D1.
    forma:
      tipo: caja
      dimensiones:
        valor: [23.0, 23.0, 23.0]
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Misma reserva cubica que 'dicroico_d1' y por el mismo
          motivo: lo que ocupa es la celda con el sustrato a 45 grados por
          dentro, no el sustrato. NO es ningun producto. ACOTADA POR ARRIBA POR
          EL BRAZO: entre D1 y la pared del banco hay 47.7 mm para D1/2, D2 y
          la camara en fila, y hoy NO CABEN. El chequeo 'brazo_beacon'
          recalcula ese margen desde el catalogo y falla mientras no quepa.
        falta: >-
          Diametro de los dos haces de beacon, longitud de onda de corte y
          envolvente del soporte
        pedir_a: Equipo de optica de ACSAR
    tipo_filtro:
      valor: paso_corto
      estado: decision
      fuente: >-
        Decision de arquitectura de ACSAR del 2026-09-20. Paso corto con el
        borde en 'integracion.optica.borde_dicroico_d2': TRANSMITE los 976 nm
        del beacon de subida en linea recta hacia la camara y REFLEJA los
        1064 nm del beacon de bajada, que entra lateralmente. EL ORDEN NO ES
        INTERCAMBIABLE: con la camara en transmision y el beacon en reflexion,
        los 100 mW del beacon tocan UNA SOLA superficie con recubrimiento antes
        de salir, y lo que se fugue en D2 se va al puerto opuesto al laser en
        vez de hacia el sensor. Invertirlo mete el beacon en transmision (dos
        superficies mas) y apunta su fuga al sensor, que es justo lo que hay
        que proteger.
    puertos:
      valor:
        - "-Y (transmision, entrada): beacon de subida 976 nm desde D1 (e06)"
        - "+Y (transmision, salida): camara de seguimiento (e07)"
        - "-X (reflexion, entrada): beacon de bajada 1064 nm desde el laser (e08)"
        - "-Y (reflexion, salida): de vuelta a D1 -> FSM -> telescopio (e09)"
        - "+X (transmision): fuga del beacon -> fotodiodo_monitor_beacon (e11)"
      estado: decision
