  - id: cables_rf_moduladores
    id_drive: ELEC-04
    referencia_comercial: null
    nombre: Coaxiales RF de PCB-2 a los dos moduladores
    categoria: payload_pcb
    subsistema: drivers_opticos
    cantidad: 2
    forma:
      tipo: caja
      dimensiones:
        valor: null
        unidad: mm
        estado: TBD
        falta: >-
          Un cable no tiene envolvente hasta que se encamina. Lo que hace falta
          es el diametro del coaxial elegido y su radio minimo de curvatura;
          con esos dos, el recorrido se dibuja como KEEP-OUT entre PCB-2 y cada
          modulador, no como un cuerpo.
        pedir_a: Equipo de electronica de ACSAR
        nota: >-
          Esta pieza NO se dibuja como solido a proposito. Un coaxial ocupa el
          tubo que barre al curvarse, y ese tubo es un volumen reservado por el
          que no puede pasar nada, que es justo lo que es un keep-out. Mientras
          falte el radio de curvatura no se dibuja nada: inventarlo daria una
          falsa sensacion de comprobacion, igual que con los bucles de fibra.
    diametro_coaxial:
      valor: null
      unidad: mm
      estado: TBD
      falta: Diametro exterior del coaxial elegido (con su cubierta)
      pedir_a: Equipo de electronica de ACSAR
    radio_minimo_curvatura:
      valor: null
      unidad: mm
      estado: TBD
      falta: >-
        Radio minimo de curvatura del coaxial. Es lo que fija el volumen que
        hay que reservar, y para un coaxial semirrigido no es pequeno.
      pedir_a: Equipo de electronica de ACSAR
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa por metro del coaxial elegido, y longitud una vez encaminado
      pedir_a: Equipo de electronica de ACSAR
    nota: >-
      Los dos coaxiales criticos del payload: llevan la senal de modulacion de
      PCB-2 (en la pila de plataforma, -X) a los moduladores (en la franja,
      +X), asi que CRUZAN el satelite a lo ancho. La topologia esta en
      data/connections.yaml (r02 y r03) y sus conectores de destino SI son dato
      (6.1 x 10 mm, plano de Exail); lo que falta es el cable.

