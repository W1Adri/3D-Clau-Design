        o DE IDA Y VUELTA. No es un detalle de implementacion: un esquema en
        lazo anade componentes en el camino -- un circulador o un divisor de
        polarizacion -- y ESO CAMBIA LA CADENA declarada en
        data/connections.yaml y la reserva de volumen de la franja.
