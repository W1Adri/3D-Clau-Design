      falta: Masa del aislador elegido
      pedir_a: Equipo de payload de ACSAR

  - id: filtro_espectral
    id_drive: OPT-06
    referencia_comercial: null
    nombre: Filtro espectral
    categoria: payload_bandeja
    subsistema: bandeja_optica
    cantidad: 1
    montaje:
      cara: "-Z"
      eje: X
      tipo_eje: fibra
      nota: Componente en linea.
    forma:
      tipo: cilindro
      eje: X
      dimensiones:
        valor: [40.0, 5.5, 5.5]
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Encapsulado cilindrico en linea tipico de los componentes
          pasivos de fibra de telecomunicaciones (del orden de 5.5 mm de
          diametro por 35-40 mm de cuerpo). NO es ningun producto: no hay
          candidato elegido, asi que no hay ficha que copiar. Sirve para
          reservar un volumen del orden correcto en la bandeja y para que el
          recorrido de fibra tenga extremos donde apoyarse. La cifra real
          cambiara, y puede cambiar mucho si se elige un encapsulado en caja.
        falta: Modelo de filtro elegido, su ancho de banda y su envolvente
        pedir_a: Equipo de payload de ACSAR
    tipo:
      valor: DWDM_pelicula_delgada_fibra_PM
      estado: decision
      fuente: >-
        Decision de ACSAR (Adri), 2026-09-21, analisis de polarizacion del
        transmisor BB84. Filtro DWDM de pelicula delgada en fibra PM, en linea.
        En fibra PM porque esta antes del codificador, en el tramo donde la luz
        va en polarizacion lineal fija alineada al eje lento.
    ancho_banda:
      valor: 0.8
      unidad: nm
      estado: supuesto
      fuente: >-
        SUPUESTO. Canal DWDM de 100 GHz, que a 1550 nm son unos 0.8 nm. El
        razonamiento es por los dos lados: un pulso de CONMUTACION DE GANANCIA
        lleva chirp y ocupa DECIMAS DE NM, asi que un filtro mas estrecho lo
        recorta y lo deforma -- y deformar el pulso es deformar la senal que
        mide el enlace --; y un filtro mas ancho deja pasar mas ASE y abre mas
        la ventana por la que puede entrar luz de Troya. 100 GHz es la rejilla
        DWDM comercial que cae en ese hueco. NO sale de ninguna ficha: no hay
        filtro elegido ni medida del ancho espectral del pulso.
      falta: >-
        Ancho espectral real del pulso del DFB conmutado en ganancia, y ancho de
        banda del filtro elegido
      pedir_a: Equipo de payload de ACSAR
    nota: >-
      SIN CANDIDATO: la envolvente que se dibuja es una reserva, no una pieza.
      QUE HACE AQUI, que no es lo que se suele suponer: en esta arquitectura --
      UN SOLO LASER y moduladores externos -- todos los pulsos salen IDENTICOS
      del DFB, asi que el canal lateral espectral entre estados es pequeno por
      construccion (el problema clasico es el de varios laseres, uno por
      estado, que nunca son identicos). Lo que este filtro hace de verdad es
      QUITAR LA ASE del laser y ESTRECHAR LA VENTANA DE TROYA: cuanto mas
      estrecha la banda por la que puede entrar luz del canal, menos margen
      tiene un atacante para sondear los moduladores.
      VA ANTES DE LOS MODULADORES para que todo lo que se module ya este
      espectralmente limpio.
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa del filtro elegido
      pedir_a: Equipo de payload de ACSAR

  - id: acoplador_monitor
    id_drive: OPT-07
    referencia_comercial: null
    nombre: Acoplador 2x2 de monitorizacion + dos fotodiodos
    categoria: payload_bandeja
    subsistema: bandeja_optica
    cantidad: 1
    montaje:
      cara: "-Z"
      eje: X
      tipo_eje: fibra
      nota: >-
        Son TRES cosas en una envolvente: el acoplador 2x2 (un tubo de empalme
        en linea) y los DOS fotodiodos con sus encapsulados. Se modelan juntas
        porque van juntas; al elegir modelo habra que separarlas.
    forma:
      tipo: caja
      dimensiones:
        valor: [60.0, 20.0, 12.0]
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Reserva para un acoplador de derivacion 2x2 en linea (tubo
          de unos 60 mm) mas el encapsulado de DOS fotodiodos InGaAs con su
          transimpedancia: el de monitorizacion hacia delante y el VIGIA DE
          TROYA hacia atras. NO es ningun producto: no hay candidato elegido.
          LOS DOS FOTODIODOS VAN DENTRO DE ESTA RESERVA y no como piezas
          sueltas: separarlos anadiria dos cuerpos mas a la franja, que es
          donde aprieta, y la geometria de cada uno depende por completo de si
          el detector va aqui o montado en PCB-2, que es la decision que falta.
          El volumen no crece respecto a la version de un solo fotodiodo porque
          la reserva ya era generosa para uno; si los dos detectores acaban
          siendo dos encapsulados separados, crece.
        falta: >-
          Modelo de acoplador 2x2 y de los dos fotodiodos, y si van en la
          bandeja o montados en PCB-2
        pedir_a: Equipo de payload de ACSAR
    razon_acoplamiento:
      valor: [99.0, 1.0]
      estado: supuesto
      fuente: >-
        SUPUESTO. 99:1, la razon habitual de un tap de monitorizacion: deriva el
        1 % justo para medir y deja el 99 % en el canal. NO sale de ninguna
        ficha. El valor que de verdad haga falta depende de la sensibilidad del
        fotodiodo elegido y del nivel al que trabaje el MXER, y sobre todo de
        que se pueda medir el nivel de VACIO, que es el mas bajo de los tres.
      falta: >-
        Razon de acoplamiento del acoplador elegido, y sensibilidad del
        fotodiodo, que es lo que la fija
      pedir_a: Equipo de payload de ACSAR
    puertos:
      valor:
        - "entrada: senal que llega del MXER (f04)"
        - "salida: senal que sigue hacia el VOA (f05)"
        - "derivacion HACIA DELANTE: fotodiodo de monitorizacion -- lazo de bias del MXER y razones decoy/senal (m01)"
        - "derivacion HACIA ATRAS: fotodiodo VIGIA DE TROYA -- luz que entra desde el canal (m02)"
      estado: decision
      fuente: >-
        Decision de ACSAR (Adri), 2026-09-21, analisis de polarizacion del
        transmisor BB84. Pasa de acoplador de derivacion simple a ACOPLADOR 2x2
        CON DOS FOTODIODOS, por el mismo motivo por el que los dicroicos
        declaran sus cuatro puertos: un acoplador 2x2 tiene cuatro puertos y los
        cuatro reciben luz, se dibujen o no. El de delante es el tap de siempre.
        El de atras ve la luz que entra DESDE EL CANAL, que ha recorrido el
        codificador y el VOA en sentido inverso, y es el unico sitio de la
        cadena donde se puede ver venir un ataque de CABALLO DE TROYA sin tocar
        el haz util.
    nota: >-
      SIN CANDIDATO: la envolvente que se dibuja es una reserva, no una pieza.
      VA DETRAS DEL MXER, que es lo que monitoriza, Y ANTES DEL VOA, donde
      todavia hay luz suficiente para medir: detras del VOA la senal esta ya a
      fracciones de foton por pulso y no hay nada que medir con un fotodiodo.
      "BIAS" AQUI ES EL PUNTO DE TRABAJO, NO LA LONGITUD DE ONDA. Un modulador
      Mach-Zehnder de niobato tiene una transmision en cos^2 del voltaje, y esa
      curva SE DESPLAZA EN VOLTAJE con la temperatura y con la deriva de carga
      del sustrato. El lazo de bias mide con este fotodiodo y corrige el voltaje
      de continua para mantener el punto de trabajo; no toca el laser.
      PARA VERIFICAR CADA NIVEL POR SEPARADO -- senal, decoy, vacio -- no basta
      un fotodiodo lento promediando: hace falta un fotodiodo RAPIDO capaz de
      resolver pulso a pulso, o secuencias de calibracion de patron conocido
      intercaladas en la transmision. Es una decision de PCB-2 y del lazo de
      control, no de mecanica, pero decide el fotodiodo y con el esta reserva.
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa del acoplador 2x2 y los dos fotodiodos
      pedir_a: Equipo de payload de ACSAR

