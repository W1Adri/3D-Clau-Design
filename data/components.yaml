      valor: null
      unidad: mm
      estado: TBD
      falta: >-
        Longitud minima de pigtail de salida que Exail puede suministrar en el
        encapsulado de grado espacial, y SI OFRECE SALIDA CON COLIMADOR
        INTEGRADO. Lo segundo eliminaria el empalme posterior al codificador y
        con el los 60 mm de 'integracion.fibra.longitud_protector_empalme', que
        es justo lo que hoy hace que el tramo recto no quepa en la franja (ver
        el chequeo 'fibra_post_codificacion').
