# =====================================================================
# CLAU - Catalogo unico de componentes
# ---------------------------------------------------------------------
# REGLA PRINCIPAL: ningun numero inventado.
# Cada magnitud es un bloque con: valor, unidad, estado y fuente.
#
# estado:
#   confirmado  -> ficha tecnica / norma del componente elegido
#   referencia  -> dato de un componente parecido, NO el elegido
#   decision    -> decision de diseno de ACSAR (no viene de ninguna ficha)
#   TBD         -> falta el dato. valor: null. Obliga a 'falta' y 'pedir_a'.
#
# 'alternativas' guarda cifras discrepantes entre fuentes (no se elige una).
# Ejes locales de cada pieza: valor: [dx, dy, dz] en mm.
# =====================================================================

meta:
  mision: CLAU - CubeSat Laser per a Aplicacions Ultrasegures
  organizacion: ACSAR (EETAC, UPC)
  arquitectura: >-
    Opcion B (19-09-2026): transmisor BB84 con decoy states en componentes de
    fibra comerciales (DFB pulsado 1550 nm + moduladores de niobato de litio),
    polarizacion. Sin PIC en vuelo y sin canal optico clasico.
    Canal clasico de post-procesado por radio en banda S.
  revision_datos: 2026-09-19

# ---------------------------------------------------------------------
# 1. NORMA Y ENVOLVENTE
# ---------------------------------------------------------------------
norma:
  documento: CubeSat Design Specification Rev. 14.1, The CubeSat Program, Cal Poly SLO
  fecha: 2022-02-09
  url: https://static1.squarespace.com/static/5418c831e4b0fa4ecac1bacd/t/62193b7fc9e72e0053f00910/1645820809779/CDS+REV14_1+2022-02-09.pdf
  nota: >-
    CDS Rev 14 sustituye a CDS Rev 13 y a la 6U CDS Rev 1.0. El plano 6U es
    CDS-14-007 (Appendix B). Verificado contra el PDF original el 2026-09-19.

envolvente_6u:
  dimensiones:
    valor: [226.3, 100.0, 366.0]
    unidad: mm
    estado: confirmado
    fuente: CDS Rev 14.1, Appendix B, plano CDS-14-007 "6U CUBESAT"
    nota: X = 226.3 (ancho), Y = 100.0 (alto), Z = 366.0 (largo). Origen en el centro geometrico.
  masa_maxima:
    valor: 12000
    unidad: g
    estado: confirmado
    fuente: CDS Rev 14.1, Tabla 1 "CubeSat Mass Specifications"
  cdg_maximo:
    valor: [45.0, 20.0, 70.0]
    unidad: mm
    estado: confirmado
    fuente: CDS Rev 14.1, Tabla 2
    nota: Desviacion maxima del centro de gravedad respecto del centro geometrico, por eje.
  ancho_rail_minimo:
    valor: 8.5
    unidad: mm
    estado: confirmado
    fuente: CDS Rev 14.1, requisito 2.2.5
    nota: Distancia del borde del rail a la primera protuberancia, en cada cara.
  protrusion_maxima:
    valor: 6.5
    unidad: mm
    estado: confirmado
    fuente: CDS Rev 14.1, requisito 2.2.3
    nota: Ningun componente sobresale mas de 6.5 mm del plano del rail en las caras permitidas.
  contacto_extremo_rail:
    valor: [6.5, 6.5]
    unidad: mm
    estado: confirmado
    fuente: CDS Rev 14.1, requisito 2.2.8
  cara_insercion:
    valor: "-Z"
    unidad: null
    estado: confirmado
    fuente: CDS Rev 14.1, requisito 2.2.2
    nota: La cara -Z entra primero en el dispensador.

# Espesor de pared: NO viene de ninguna norma. Depende del chasis real.
# Se aisla aqui como unico parametro para no esparcir hipotesis por el codigo.
zona_util_interior:
  espesor_pared:
    valor: 4.9
    unidad: mm
    estado: decision
    fuente: >-
      Cota superior derivada de datos confirmados: el contorno PC104 de la gama
      AAC (90.17 mm) tiene que caber en los 100.0 mm exteriores del 6U, luego
      el espesor no puede pasar de (100.0 - 90.17) / 2 = 4.915 mm.
    nota: >-
      Valor UNICO de trabajo mientras no llegue el chasis real. Es el CASO MAS
      DESFAVORABLE compatible con las tarjetas PC104: un chasis real tendra
      paredes mas finas y MAS zona util, asi que todo informe de volumen libre
      que salga de aqui se queda corto, nunca se pasa. No procede de ninguna
      ficha. Al sustituir el chasis por el STEP del equipo, la zona util se
      derivara de la geometria real y este parametro desaparece.
    falta: Chasis 6U del equipo en STEP, o plano con espesores y zona util
    pedir_a: Equipo de estructura de ACSAR

