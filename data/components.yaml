  - id: espejo_plegado_cuantico
    id_drive: OPT-19
    referencia_comercial: null
    nombre: Espejo de plegado del canal cuantico (plano metalico a 45 grados)
    categoria: payload_optico
    subsistema: terminal_optico
    cantidad: 1
    montaje:
      cara: "-Y"
      eje: Z
      tipo_eje: optico
      nota: >-
        El sustrato va a 45 grados dentro del soporte; lo que se declara aqui
        es el soporte, que es lo que ocupa, y por eso la envolvente va alineada
        con los ejes (mismo criterio que los dos divisores). El eje declarado
        es Z porque es por donde le ENTRA el haz, bajando del colimador; sale
        hacia -X, hacia D1.
    forma:
      tipo: caja
      dimensiones:
        valor: [20.0, 20.0, 20.0]
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO, y ACOTADO POR ABAJO POR EL HAZ. Un haz de d mm que incide a
          45 grados deja una huella de d x d*raiz(2) sobre el espejo -- el
          mismo razonamiento que decide si el MEMS del FSM vale, ver CLAUDE.md
          4.7(c) --, asi que con el diametro de haz modelado
          ('integracion.optica.diametro_haz_modelado', 10 mm, SUPUESTO) la
          huella es de 10 x 14.1 mm y el sustrato no puede bajar de ahi. Se
          reserva un CUBO DE 20 mm para el soporte, que admite un sustrato de
          unos 14 mm a 45 grados con margen de apertura libre y celda. NO es
          ningun producto: no hay candidato elegido.
          Y ESTA ACOTADO POR ARRIBA POR EL BANCO, igual que el colimador y D1:
          esta pieza ocupa en la linea en X el sitio que antes ocupaba el
          colimador, y el chequeo 'banco_optico' recalcula ese margen desde el
          catalogo.
        falta: >-
          Diametro del haz colimado (del que sale el tamano del sustrato) y
          envolvente del soporte del espejo elegido
        pedir_a: Equipo de optica de ACSAR
    retardancia_45_1550:
      valor: null
      unidad: grados
      estado: TBD
      falta: >-
        DIFERENCIA DE FASE s-p DEL RECUBRIMIENTO A 45 GRADOS Y 1550 nm, CON LA
        CURVA DE FASE MEDIDA, no solo la reflectancia. Hay que especificar
        PLATA PROTEGIDA u ORO PROTEGIDO exigiendo esa curva al fabricante: la
        reflectancia alta es facil y la casi todos los recubrimientos la dan,
        pero la retardancia a 45 grados es lo que transforma los estados de
        polarizacion, y casi ningun catalogo la publica.
        LO QUE SE PIDE ES ESTABILIDAD, NO VALOR ABSOLUTO: ver la nota.
      pedir_a: Equipo de optica de ACSAR
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa del espejo y su soporte
      pedir_a: Equipo de optica de ACSAR
    nota: >-
      SIN CANDIDATO: lo que se dibuja es una reserva, no una pieza.
      QUE HACE: dobla el canal cuantico de -Z a -X. Existe porque el
      codificador de polarizacion tiene que alimentar al colimador EN LINEA
      RECTA -- nada de fibra curvada despues de la codificacion --, y eso obliga
      al colimador a apuntar segun Z, mientras que la linea D1 -> FSM ->
      telescopio va segun X y no se mueve. Ver CLAUDE.md 3.10.
      LO QUE CUESTA, y hay que escribirlo: es una SEGUNDA SUPERFICIE A 45
      GRADOS en el camino cuantico, y esta EN EL MISMO PLANO DE INCIDENCIA que
      el FSM -- los dos pliegan en X-Z --, asi que sus retardancias SE SUMAN en
      vez de compensarse. Si estuvieran en planos perpendiculares se
      cancelarian en primer orden; no es el caso y no se puede fingir que lo
      sea.
      POR QUE AUN ASI NO ES UN PROBLEMA: el efecto es UNITARIO Y ESTATICO. Una
      retardancia fija no destruye informacion, solo gira el marco de
      referencia de polarizacion, y la estacion de tierra ya tiene que calibrar
      ese marco de todas formas (el satelite pasa girando sobre su cabeza). La
      diatenuacion -- que si atenuaria unos estados mas que otros -- es
      despreciable en un metal protegido a 45 grados. Por eso el requisito es
      de ESTABILIDAD: que la retardancia no DERIVE con la temperatura ni con el
      envejecimiento entre calibraciones. Eso es lo que pide
      'retardancia_45_1550'.

  - id: colimador
    id_drive: OPT-08
    referencia_comercial: null
    nombre: Colimador fibra a espacio libre
    categoria: payload_optico
    subsistema: terminal_optico
    cantidad: 1
    montaje:
      cara: "-Y"
      eje: X
      tipo_eje: optico
      nota: >-
        Es la frontera: le entra fibra por -X y le sale haz libre por +X. Se
        fija con abrazadera en V al banco.
        EN EL LAYOUT VA GIRADO PARA QUE SU EJE VAYA SEGUN Z, con la fibra
        entrando por +Z y el haz saliendo hacia -Z, contra el espejo de
        plegado. No es un capricho de reparto: lo alimenta el codificador de
        polarizacion EN LINEA RECTA, y el codificador esta en la franja, que
        esta en +Z. Ver CLAUDE.md 3.10.
    forma:
      tipo: cilindro
      eje: X
      dimensiones:
        valor: [28.0, 12.0, 12.0]
        unidad: mm
        estado: supuesto
        fuente: >-
          SUPUESTO. Reserva para un colimador de fibra de banco: barrilete
          cilindrico de unos 12 mm de diametro. NO es ningun producto. El
          diametro del barrilete lo fija el del haz colimado, que es TBD, asi
          que esta cifra se movera con el.
          ACOTADA POR ARRIBA POR EL BANCO, ademas: el FSM tiene que estar sobre
          el eje optico del telescopio, y entre ese eje y la pared +X de la
          columna de payload quedan unos 56 mm para el colimador y D1
          juntos, gaps incluidos. Si las piezas reales son mayores no es que el
          modelo este mal: es que el banco no da, y habra que alargarlo a costa
          de la bandeja o de la longitud reservada al telescopio. El chequeo
          'banco_optico' recalcula ese margen desde el catalogo.
        falta: >-
          Diametro del haz colimado y modelo de colimador. Es el mismo dato que
          bloquea los keep-outs del camino optico.
        pedir_a: Equipo de optica de ACSAR
    nota: >-
      Frontera entre la cadena de fibra y el camino en espacio libre.
      SIN CANDIDATO: lo que se dibuja es una reserva.
      ES LA UNICA PIEZA QUE PUEDE IR DETRAS DEL CODIFICADOR. Todo lo demas de
      la cadena -- aislador, filtro, VOA, acopladores -- va delante, porque
      cualquiera de ellos proyecta o deforma los cuatro estados BB84. Y el
      tramo de fibra que lo alimenta tiene que ser RECTO: los estados
      diagonales viajan a 45 grados de los ejes de la fibra PM, no son
      autoestados, y cualquier curva les mete una fase que deriva con la
      temperatura.
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa del colimador elegido
      pedir_a: Equipo de optica de ACSAR

