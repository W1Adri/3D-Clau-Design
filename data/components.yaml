  - id: bandeja_optica
    id_drive: OPT-14
    referencia_comercial: null
    nombre: Bandeja optica (placa mecanica, no PCB)
    categoria: payload_bandeja
    subsistema: bandeja_optica
    cantidad: 1
    montaje:
      cara: "-Y"
      nota: >-
        Placa horizontal: se atornilla por su cara -Y al chasis y los
        componentes de fibra se fijan encima, en +Y. No declara eje de senal:
        no es un componente optico, es el soporte de todos los demas.
    forma:
      tipo: caja
      dimensiones:
        valor: [117.7, 3.0, 102.4]
        unidad: mm
        estado: supuesto
        fuente: >-
          El CONTORNO si esta derivado: es la zona z_payload_bandeja del layout
          confirmado (121.7 x 106.4 mm en X y Z) menos 2 mm por lado de holgura
          de montaje. El ESPESOR de 3 mm esta inventado, y la holgura de 2 mm
          tambien: no hay ni material elegido ni analisis estructural. Como la
          magnitud es una sola, el bloque entero va como supuesto, que es lo
          honesto: dos de las tres cotas dependen de un numero sin respaldo.
        falta: >-
          Material, espesor y patron de taladros de la placa, del analisis
          estructural y termico
        pedir_a: Equipo de estructura de ACSAR
        nota: >-
          Al cambiar el reparto (por ejemplo cuando llegue la longitud real del
          telescopio) esta cota deja de cuadrar con su zona. El chequeo
          'bandeja_en_su_zona' lo detecta.
    nota: >-
      Necesita control termico propio: la extincion garantizada del modulador de
      intensidad solo cubre 0 a +70 C. Reservar espacio para sensores y calefactores.
      Los dos moduladores NO van encima: desde el 2026-09-20 van en la franja
      lateral, junto al telescopio (ver CLAUDE.md 3.6).
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa de la placa, que sale del contorno y el material una vez fijado el layout
      pedir_a: Este repositorio, tras fijar el layout

  - id: laser_dfb_1550
    id_drive: OPT-01
    referencia_comercial: Gooch & Housego, modulo DFB 1550 nm ESCC-23201
    nombre: Laser DFB 1550 nm, Gooch & Housego (modulo validado para espacio)
    categoria: payload_bandeja
    subsistema: bandeja_optica
    cantidad: 1
    montaje:
      cara: "-Z"
      eje: X
      tipo_eje: fibra
      nota: >-
        Butterfly de montaje en superficie: se atornilla por su base (-Z local)
        a la bandeja, que le hace de disipador. La fibra de salida sale por +X.
    forma:
      tipo: caja
      dimensiones:
        valor: [37.4, 12.7, 7.8]
        unidad: mm
        estado: referencia
        fuente: https://www.phix.com/wp-content/uploads/2025/10/PHIX-BTF14-Design-Guidelines.pdf
        nota: >-
          Contorno del encapsulado BUTTERFLY DE 14 PINES estandar (seccion
          "BTF14 dimensions": bulk external sin pines 37.4 x 12.7 x 7.8 mm,
          tolerancia +/-0.2). NO es el plano de Gooch & Housego: es la cota del
          formato en el que viene el modulo. G&H no publica plano mecanico del
          ESCC-23201. Sirve para reservar volumen con una cifra real de un
          encapsulado real; el contorno exacto de ESTE modulo sigue pendiente,
          y sobre todo falta el DISIPADOR, que con 4.1 W no es opcional y no
          esta en ninguna de estas cotas.
        falta: >-
          Plano mecanico del modulo G&H ESCC-23201 y, sobre todo, el disipador
          o la interfaz termica que necesitan sus 4.1 W.
        pedir_a: Gooch & Housego / Equipo termico de ACSAR
        alternativas:
          - valor: [37.4, 43.3, 7.8]
            fuente: https://www.phix.com/wp-content/uploads/2025/10/PHIX-BTF14-Design-Guidelines.pdf
            nota: >-
              "Envelope external dimensions (with pins and ports)". Los pines
              salen por los dos lados y llevan el ancho de 12.7 a 43.3 mm. Es la
              cota que manda para el hueco en la bandeja, no para el cuerpo.
      conectores:
        - id: pines_btf14
          tipo: electrico
          cara: "+Y"
          dimensiones:
            valor: [30.0, 15.3, 4.0]
            unidad: mm
            estado: supuesto
            fuente: >-
              El saliente de 15.3 mm por lado sale de las dos cotas del plano
              BTF14: (43.3 - 12.7) / 2. Las otras dos, 30 mm de largo y 4 mm de
              alto, estan INVENTADAS: el plano no acota la fila de pines, solo
              el envolvente total.
            falta: Cotas de la fila de pines del modulo elegido
            pedir_a: Gooch & Housego
          nota: 7 pines por lado. El lado opuesto lleva la fila simetrica.
        - id: pines_btf14_b
          tipo: electrico
          cara: "-Y"
          dimensiones:
            valor: [30.0, 15.3, 4.0]
            unidad: mm
            estado: supuesto
            fuente: Simetrico de 'pines_btf14'. Mismas cotas y mismo origen.
            falta: Cotas de la fila de pines del modulo elegido
            pedir_a: Gooch & Housego
    potencia_nominal:
      valor: 4.1
      unidad: W
      estado: confirmado
      fuente: Brief ACSAR 2026-09-19 (cita ficha Gooch & Housego)
      nota: >-
        La ficha indica "<4.1 W" electricos, incluido el Peltier. Es el mayor
        consumo del payload. Se toma la cota como valor nominal.
    potencia_optica:
      valor: 90.0
      unidad: mW
      estado: confirmado
      fuente: Brief ACSAR 2026-09-19 (cita ficha Gooch & Housego)
      nota: La ficha indica ">90 mW".
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa del modulo butterfly con Peltier
      pedir_a: Gooch & Housego

