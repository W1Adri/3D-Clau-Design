  - id: telescopio_cassegrain
    id_drive: OPT-13
    referencia_comercial: Aperture Optical Sciences, Cassegrain a medida, apertura 90 mm
    nombre: Telescopio Cassegrain on-axis, apertura 90 mm
    categoria: payload_optico
    subsistema: terminal_optico
    cantidad: 1
    montaje:
      cara: "-Z"
      eje: Z
      tipo_eje: optico
      nota: >-
        Eje optico segun Z, apuntando a +Z. Se monta por su brida trasera
        (-Z local), que es por donde le entra el haz desde el FSM.
    forma:
      tipo: cilindro
      eje: Z
      step_esperado:
        ruta: cad/vendor/aperture_optical_sciences/telescopio_cassegrain.step
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
        fuente_prevista: >-
          Telescopio Cassegrain de Aperture Optical Sciences, via Oscar (ACSAR).
          Existe ya un concepto en Telescopio_concepto.SLDPRT (entrega
          "Preliminar viability model" del 2026-09-20), que hay que reexportar
          a STEP AP214 o AP242 porque el formato nativo de SolidWorks no hay
          manera de leerlo.
        nota: >-
          En cuanto el fichero este en esa ruta, sustituye al cilindro de
          reserva sin tocar nada mas. Entrara como 'referencia' hasta verificar
          que es el barrilete definitivo y no el concepto.
      dimensiones:
        valor: [95.4, 95.4, 200.0]
        unidad: mm
        estado: supuesto
        fuente: >-
          COTA SUPERIOR, no una medida. El diametro es la altura interior del
          6U (95.4 mm): el barrilete no puede pasar de ahi, luego este es el
          telescopio MAS GRANDE que cabe, no el que hay. La longitud es la ya
          reservada en el layout ('longitud_reservada', 200 mm, provisional).
          Dibujarlo asi hace visible lo que dice el chequeo
          'apertura_vs_altura': con 90 mm de apertura libre quedan 2.7 mm por
          lado para barrilete, celda y ajuste, que no da para nada. Si el
          diametro real bajase, la columna de payload se abriria; si no cabe,
          el telescopio tendra que ser el propio elemento estructural de esa
          cara.
        falta: >-
          Diametro exterior del barrilete y longitud optica real. YA EXISTE un
          concepto en formato nativo SolidWorks (Telescopio_concepto.SLDPRT,
          entrega "Preliminar viability model" del 2026-09-20), ilegible. Hace
          falta reexportarlo a STEP AP214 o AP242 y dejarlo en la ruta de
          'step_esperado'. Ver cad/vendor/MANIFEST.yaml, seccion
          'sin_convertir'.
        pedir_a: Oscar (ACSAR) / Aperture Optical Sciences
        nota: >-
          El brief indica "aprox. 2U" y apertura libre 90 mm, pero 2U no fija el
          contorno. El diametro exterior es el numero critico: ver el chequeo
          'apertura_vs_altura' en el analisis. OJO con el "2U": la U de longitud
          de la CDS son 113.5 mm, no 100, asi que "2U" son ~227 mm. La longitud
          real saldra del STEP del telescopio (Oscar), no de esta cifra.
    longitud_reservada:
      valor: 200.0
      unidad: mm
      estado: decision
      fuente: >-
        Decision de reparto ACSAR del 2026-09-20, al pasar los moduladores a la
        franja lateral. Es el hueco que se le RESERVA al telescopio en Z dentro
        de la columna de payload, no una longitud medida.
      nota: >-
        PROVISIONAL. Valor de trabajo mientras no llegue el STEP. No confundir
        con los "~2U" del brief: con la U de longitud de la CDS (113.5 mm) esos
        2U son 227 mm, no 200. La distribucion admite hasta 306.4 mm vaciando la
        bandeja; con 200 mm quedan 106.4 mm de bandeja y con 227 mm quedan
        79.4 mm. Cambiar este valor y regenerar el layout es todo lo que hace
        falta para reasignar el reparto.
    apertura_libre:
      valor: 90.0
      unidad: mm
      estado: decision
      fuente: Decision de diseno ACSAR (arquitectura opcion B, 19-09-2026)
      nota: Tipo empleado en QUBE-II. Fabricacion a medida.
    longitud_optica:
      valor: null
      unidad: mm
      estado: TBD
      falta: Longitud del tubo. Interesa distancia focal larga; se admite acortar.
      pedir_a: Aperture Optical Sciences
    masa:
      valor: null
      unidad: g
      estado: TBD
      falta: Masa
      pedir_a: Aperture Optical Sciences
    requiere_vista_exterior: true
    nota_vista: La apertura necesita vision despejada hacia el exterior (keep-out del haz).

