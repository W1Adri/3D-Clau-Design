          desborde que no es real.
      dimensiones:
        valor: [95.89, 90.17, 5.51]
        unidad: mm
        estado: confirmado
        fuente: https://www.aac-clyde.space/wp-content/uploads/2021/10/AAC_DataSheet_Kryten.pdf
        nota: >-
          La ficha cubre la familia KRYTEN-M3; el sufijo PLUS anade GNSS.
          La altura 5.51 mm es "from top PCB to lowest component": NO es el paso
          de apilamiento PC104, que se trata aparte (ver pila_pc104).
