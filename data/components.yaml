          (integracion.pila_pc104.contorno, 95.89 x 90.17 mm), y esta
          PROPUESTO, no confirmado. La ALTURA, 15.0 mm, esta inventada: es la
          posicion de separador PC/104 (15.24 mm) menos holgura, o sea lo que
          el layout ya le reserva a esta tarjeta.

          OJO CON LA CIRCULARIDAD: comprobar que esta tarjeta cabe en SU
          posicion de separador devuelve la hipotesis, no un resultado, por el
          mismo motivo que el chequeo 'seccion_componentes' sale como no
          comprobable. Lo que si comprueba de verdad es que no choca con las
          tarjetas vecinas ni se sale de la columna, y eso depende de las
          alturas de las OTRAS, que si son datos. En cuanto llegue la altura
          real, si pasa de 15.24 mm la tarjeta ocupara dos posiciones y la pila
          crecera 15.24 mm; hay 102 mm de margen.
        falta: >-
          Altura real de la tarjeta, que la fija el componente mas alto (la
          FPGA y su disipador, si lleva). Y confirmar el contorno PC104.
        pedir_a: Equipo de electronica de ACSAR
    nota: >-
