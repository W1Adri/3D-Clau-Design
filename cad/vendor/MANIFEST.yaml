# =====================================================================
# CLAU - Manifiesto de los STEP de fabricante
# ---------------------------------------------------------------------
# Los ficheros CAD de fabricante NO se versionan en git: el repositorio es
# publico y los CAD de AAC (y de la mayoria de proveedores) suelen venir con
# condiciones que no permiten redistribuirlos. Hasta revisar esas condiciones,
# no van a GitHub.
#
# Lo que si se versiona es este manifiesto: la huella exacta del fichero que se
# uso en cada commit del layout. Asi se mantiene la trazabilidad que buscaba
# cad/vendor/README.md sin publicar el CAD.
#
# Quien clona el repositorio SIN los ficheros puede ejecutarlo todo igual: los
# componentes sin STEP disponible se dibujan con su caja envolvente. El chequeo
# 'step_de_fabricante' avisa de lo que falta, pero no falla por ello.
#
#   uv run clau3d validar   comprueba presencia y huella
#
# Para conseguir los ficheros, ver 'origen' mas abajo y cad/vendor/README.md.
# =====================================================================

meta:
  actualizado: 2026-09-20
  nota: >-
    Entrega "Preliminar viability model" del equipo de ACSAR, recibida el
    2026-09-20 como un unico zip. De los 10 ficheros del zip solo 4 son STEP;
    los otros 6 son formato nativo SolidWorks y no hay manera de leerlos.

origen:
  drive: MySatNotes/components
  estado: TBD
  falta: >-
    Ruta o enlace exacto de la carpeta de Drive donde queda la copia de
    referencia de estos ficheros.
  pedir_a: Adria (ACSAR)
  nota: >-
    Carpeta acordada: MySatNotes/components. Falta el enlace completo para
    poder ponerlo en el README.

